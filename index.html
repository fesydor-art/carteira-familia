<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("cf-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: menu lateral fixo no desktop (navegação + ação principal), conteúdo em coluna única com resumo no topo;
   no celular o menu vira barra inferior e o botão + flutua. Tokens abaixo para claro/escuro. */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#E2E8F0; --line:#E2E8F0;
  --fg:#0F172A; --muted:#475569; --subtle:#64748B;
  --accent:#4338CA; --accent-2:#6D28D9; --accent-fg:#FFFFFF; --accent-soft:#EEF2FF;
  --pos:#065F46; --pos-soft:#ECFDF5; --neg:#991B1B; --neg-soft:#FEF2F2; --warn:#92400E; --warn-soft:#FFFBEB;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px -8px rgba(15,23,42,.10);
  --shadow-lg:0 24px 48px -16px rgba(15,23,42,.28);
  --overlay:rgba(15,23,42,.45);
  --f-sans:"Inter",-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#1E293B; --surface-2:#273449; --surface-3:#334155; --line:#334155;
  --fg:#F1F5F9; --muted:#CBD5E1; --subtle:#94A3B8;
  --accent:#A5B4FC; --accent-2:#C4B5FD; --accent-fg:#0F172A; --accent-soft:rgba(165,180,252,.12);
  --pos:#6EE7B7; --pos-soft:rgba(110,231,183,.10); --neg:#FCA5A5; --neg-soft:rgba(252,165,165,.10); --warn:#FCD34D; --warn-soft:rgba(252,211,77,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -10px rgba(0,0,0,.5); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
  --overlay:rgba(2,6,23,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#273449; --surface-3:#334155; --line:#334155;
  --fg:#F1F5F9; --muted:#CBD5E1; --subtle:#94A3B8;
  --accent:#A5B4FC; --accent-2:#C4B5FD; --accent-fg:#0F172A; --accent-soft:rgba(165,180,252,.12);
  --pos:#6EE7B7; --pos-soft:rgba(110,231,183,.10); --neg:#FCA5A5; --neg-soft:rgba(252,165,165,.10); --warn:#FCD34D; --warn-soft:rgba(252,211,77,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -10px rgba(0,0,0,.5); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
  --overlay:rgba(2,6,23,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 14.5px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11","ss01";transition:background-color .2s ease,color .2s ease}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.2} h2{font-size:1rem;letter-spacing:-.01em}
.num,.amt,.v,.tb td{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{flex:none;display:inline-block;vertical-align:-3px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;
  background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:.9rem;transition:transform .12s ease,filter .15s ease,background .15s ease,border-color .15s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn.danger{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s,transform .12s}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.sm{width:28px;height:28px;border-radius:7px}
.iconbtn.danger:hover{background:var(--neg-soft);color:var(--neg)}
.iconbtn.confirm{width:auto;padding:0 10px;background:var(--neg-soft);color:var(--neg);font-size:.78rem;font-weight:600}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.82rem}
.link:hover{text-decoration:underline}

/* formulários */
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:var(--surface-3)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:.88rem}
.check input{width:16px;height:16px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0;box-shadow:none}

/* estrutura */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4F46E5,#7C3AED)}
.brand strong{display:block;font-size:.95rem;letter-spacing:-.01em}
.brand span{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left;transition:background .15s,color .15s}
.snav button:hover{background:var(--surface-2);color:var(--fg)}
.snav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-foot .btn{width:100%}
.main{min-width:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
}

/* topo */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar .tb-l{min-width:0}
.topbar .tb-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mesnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow-sm)}
.mesnav .mesnome{font-weight:600;font-size:.9rem;min-width:8.6em;text-align:center;text-transform:capitalize}
.mesnav .hoje{margin:0 6px 0 2px}
.switch{position:relative;display:inline-flex;align-items:center;gap:0;width:64px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:3px;box-shadow:var(--shadow-sm)}
.switch .opt{flex:1;display:grid;place-items:center;color:var(--subtle);z-index:1;transition:color .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:28px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.switch[aria-checked="true"] .knob{transform:translateX(28px)}
.switch[aria-checked="false"] .opt.sol,.switch[aria-checked="true"] .opt.lua{color:var(--fg)}
.avatar-btn{border:0;background:none;padding:0;border-radius:999px;transition:transform .12s, box-shadow .15s}
.avatar-btn:hover{box-shadow:0 0 0 3px var(--accent-soft)}
.avatar-btn:active{transform:scale(.96)}
.avatar{border-radius:999px;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:650;letter-spacing:.02em;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .sep{width:1px;flex:none;background:var(--line);margin:4px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:500;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--surface-3)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dotc{width:8px;height:8px;border-radius:99px}

.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.86rem}
.demo-bar .ico{color:var(--warn)}

/* resumo */
.summary{display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:12px}
.summary>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.summary>div:hover{box-shadow:var(--shadow)}
.summary .hd{display:flex;align-items:center;gap:8px}
.summary .hd .ico{color:var(--subtle)}
.summary .v{font-size:1.3rem;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.2}
.summary .s{font-size:.78rem;color:var(--muted)}
.summary .tot{background:linear-gradient(135deg,#312E81,#4C1D95);border-color:transparent;color:#fff}
.summary .tot .label,.summary .tot .s,.summary .tot .hd .ico{color:rgba(255,255,255,.78)}
.summary .tot .v{font-size:1.65rem}
.v .cents{font-size:.62em;font-weight:600;opacity:.75;margin-left:1px}
@media (max-width:1100px){.summary{grid-template-columns:repeat(2,1fr)}.summary>.tot{grid-column:1/-1}}

/* painéis e listas */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h .meta{font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow-sm)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 8px;margin:0 -8px;border-radius:10px;transition:background .15s}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--surface-2)}
.item:hover+.item{border-top-color:transparent}
.dot{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:650;font-size:.78rem;background:var(--surface-2);color:var(--muted)}
.dot.bank{color:#fff}
.dot.date{flex-direction:column;line-height:1.05;color:var(--fg)}
.dot.date b{font-size:.95rem}.dot.date small{font-size:.58rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.item .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:.79rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .acts{display:flex;align-items:center;gap:4px}
.item.passou{opacity:.55}
.amt{font-weight:600;white-space:nowrap}
.amt.pos{color:var(--pos)}.amt.neg{color:var(--neg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.auto{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 0;color:var(--muted);font-size:.9rem;display:flex;gap:10px;align-items:center}
.lrow{display:flex;justify-content:space-between;font-size:.84rem;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.kpis .v{font-weight:650;font-size:1.2rem;letter-spacing:-.02em;overflow-wrap:anywhere}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis>div:first-child{grid-column:1/-1}}

/* cartões */
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 16px;margin:0 -4px}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
.cwrap{flex:0 0 300px;max-width:100%;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;perspective:900px}
.ccard{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:18px 20px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 18px 34px -18px rgba(15,23,42,.6);
  transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;user-select:none}
.ccard:hover{box-shadow:0 26px 44px -18px rgba(15,23,42,.7)}
.ccard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 110% -10%,rgba(255,255,255,.26),transparent 45%),linear-gradient(160deg,rgba(255,255,255,.08),transparent 40%);pointer-events:none}
.ccard .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.30),transparent 42%);opacity:0;transition:opacity .2s;pointer-events:none}
.ccard:hover .shine{opacity:1}
.ccard .r1{display:flex;justify-content:space-between;align-items:center;position:relative}
.ccard .bank{font-weight:650;font-size:1rem;letter-spacing:-.01em}
.ccard .chipm{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#E9D8A6,#B08D3C);position:relative;opacity:.95}
.ccard .chipm::after{content:"";position:absolute;inset:7px 9px;border:1px solid rgba(70,50,10,.4);border-radius:3px}
.ccard .pan{font-family:var(--f-mono);font-size:1rem;letter-spacing:.14em;position:relative}
.ccard .r3{display:flex;justify-content:space-between;align-items:flex-end;position:relative;gap:8px}
.ccard .holder{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;opacity:.85}
.ccard .nick{font-size:.78rem;opacity:.9;font-weight:500}
.ccard .brand{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;opacity:.95;font-style:italic}
.ccard.add{background:var(--surface);color:var(--muted);border:1.5px dashed var(--surface-3);box-shadow:none;align-items:center;justify-content:center;gap:8px;font-weight:600}
.ccard.add:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ccard.add::before{display:none}
.limit{display:flex;flex-direction:column;gap:7px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.bar>i.hot{background:var(--warn)}.bar>i.over{background:var(--neg)}

/* abas (celular) e botão + */
.tabs{display:none}
@media (max-width:900px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:2px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;border-radius:10px;color:var(--subtle);font-size:.66rem;font-weight:600}
  .tabs button[aria-selected="true"]{color:var(--accent)}
  .tabs button:active{background:var(--surface-2)}
}
.fab{display:none}
@media (max-width:900px){
  .fab{display:grid;place-items:center;position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;
    width:54px;height:54px;border-radius:16px;border:0;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;box-shadow:0 12px 28px -10px rgba(79,70,229,.7);transition:transform .12s}
  .fab:active{transform:scale(.94)}
}

/* modal */
.modal{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:10;backdrop-filter:blur(3px);animation:fade .15s ease;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:480px;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);animation:up .2s cubic-bezier(.3,.7,.4,1)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px) scale(.99)}}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.row-end{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.row-end .grow{margin-right:auto}
.err{color:var(--neg);font-size:.86rem;min-height:1.2em}
.ok{color:var(--pos);font-size:.86rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:20;box-shadow:var(--shadow-lg);animation:up .2s ease}
@media (max-width:900px){.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:180px;overflow:auto;padding:2px}
.iconpick label{display:grid;place-items:center;height:40px;border-radius:9px;border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .12s}
.iconpick label:hover{background:var(--surface-2);color:var(--fg)}
.iconpick input{position:absolute;opacity:0;pointer-events:none}
.iconpick input:checked+span{color:var(--accent)}
.iconpick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

function ic(name, cls="ico", size=18){
  const n=EMOJI_ICON[name]||name||"tag", L=window.lucide&&window.lucide.icons;
  const node=L&&(L[pascal(n)]||L.Tag);
  if(!node) return `<span class="${cls}" style="display:inline-block;width:${size}px;height:${size}px"></span>`;
  const kids=node[2].map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`).join("");
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${kids}</svg>`;
}

function avatarHTML(m,size=36,src){ const foto=src===undefined?fotoDe(m):src, nome=m?.nome||"?"; let x=0; for(const c of nome) x=(x*31+c.charCodeAt(0))>>>0;

async function reduzirImagem(file,max=320){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,ko)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error("Não consegui ler essa imagem.")); i.src=url;});
  const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=max;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max); URL.revokeObjectURL(url);
  let d=c.toDataURL("image/webp",.85); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/jpeg",.85); return d;
}
async function salvarPerfil(p){
  const avisos=[], up={nome:p.apelido};
  if(S.perfilOK) up.nome_completo=p.nome_completo;
  if(p.foto!==null){
    if(p.foto===""){ if(S.perfilOK) up.avatar_url=null; try{localStorage.removeItem("cf-avatar-"+S.user.id);}catch(e){} }
    else if(DEMO){ up.avatar_url=p.foto; }
    else if(S.perfilOK && sb.storage){
      const blob=await (await fetch(p.foto)).blob(), ext=blob.type.split("/")[1]||"webp", path=`${S.user.id}/avatar.${ext}`;
      const r=await sb.storage.from("avatars").upload(path,blob,{upsert:true,contentType:blob.type});
      if(r.error) throw new Error("Não consegui enviar a foto: "+r.error.message);
      up.avatar_url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
    } else { try{localStorage.setItem("cf-avatar-"+S.user.id,p.foto);}catch(e){} avisos.push("a foto ficou salva só neste aparelho até o SQL ser aplicado"); }
  }
  const r=await sb.from("membros").update(up).eq("familia_id",S.fam.id).eq("user_id",S.user.id);
  if(r.error) throw new Error(r.error.message);
  if(DEMO){ S.user.user_metadata={...(S.user.user_metadata||{}),full_name:p.nome_completo}; if(p.email) S.user.email=p.email; }
  else {
    const opts={data:{full_name:p.nome_completo}}; if(p.email && p.email!==S.user.email) opts.email=p.email;
    const u=await sb.auth.updateUser(opts); if(u.error) throw new Error(u.error.message);
    if(opts.email) avisos.push("enviamos um link de confirmação para o novo e-mail"); if(u.data?.user) S.user=u.data.user;
  }
  return avisos;
}

const TIPOS = {corrente:"Conta corrente",poupanca:"Poupança",investimento:"Investimento",dinheiro:"Dinheiro em espécie",beneficio:"Benefício (VR/VA)"};
const BANDEIRAS = ["visa","mastercard","elo","amex","hipercard","outra"];

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.innerHTML=ic("circle-check","ico",17)+`<span>${esc(msg)}</span>`; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
/* perfil "separado": não entra no filtro de cada pessoa (padrão: perfis de aluguel). Configuração compartilhada pelo casal. */
function separado(g){ const m=(typeof marca==="function")?marca("sep:"+g.id,"cfg"):null; return m!==null&&m!==undefined ? m : /alug/i.test(g.nome||""); }
/* filtro do topo: "todos", "p:<usuário>" ou "g:<grupo>" */
function filtro(arr, key="titular_id"){
  const [t,id]=S.pessoa.split(":");
  if(t==="g") return arr.filter(x=>x.grupo_id===id);
  // perfis privados (ex.: IPTV) ficam separados: não entram em "Todos" nem no filtro por pessoa
  const priv=new Set((S.grupos||[]).filter(g=>g.privado).map(g=>g.id));
  const sep=new Set((S.grupos||[]).filter(g=>!g.privado&&separado(g)).map(g=>g.id));
  const fora=x=>x&&x.grupo_id&&priv.has(x.grupo_id);
  if(S.pessoa==="todos") return arr.filter(x=>!fora(x));
  // filtro da pessoa = dinheiro pessoal: perfis separados (ex.: aluguel) ficam de fora
  return arr.filter(x=>x[key]===id && !fora(x) && !(x&&x.grupo_id&&sep.has(x.grupo_id)));
}
const parcTxt = x => x.parcela_total>1 ? `${x.parcela_num}/${x.parcela_total}` : ((x.descricao||"").match(/\((\d+\/\d+)\)$/)||[])[1]||"";
function grupoPadrao(){ if(S.pessoa.startsWith("g:")) return S.pessoa.slice(2); return (S.grupos.find(g=>/casal/i.test(g.nome))||S.grupos[0]||{}).id||""; }
const optsGrupos = sel => `<option value="">—</option>`+S.grupos.map(g=>`<option value="${g.id}" ${g.id===sel?"selected":""}>${esc(g.nome)}</option>`).join("");
function nomeMembro(uid){ return (S.membros.find(m=>m.user_id===uid)||{}).nome || "—"; }

function traduz(m){
  if(/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";

  if(/already registered/i.test(m)) return "Esse e-mail já tem conta. Use Entrar.";
  return m;
}

async function carregar(){
  const fid=S.fam.id;
  const q = (t,o) => sb.from(t).select("*").eq("familia_id",fid).order(...(o||["id"]));
  const [m,i,c,k,g,ca,l,rd,df] = await Promise.all([
    q("membros",["criado_em"]), q("instituicoes",["nome"]), q("v_contas",["nome"]), q("v_cartoes",["nome"]),
    q("grupos",["nome"]), q("categorias",["nome"]),
    sb.from("lancamentos").select("*").eq("familia_id",fid).order("data",{ascending:false}).order("criado_em",{ascending:false}).limit(1000),
    q("rendas",["dia"]), q("despesas_fixas",["dia"])
  ]);
  const err=[m,i,c,k,g,ca,l,rd,df].find(r=>r.error); if(err) { toast("Erro ao carregar: "+err.error.message); }
  S._nomes=null; S._rec=null; S._auto=null; S._marcas=null; S._agc=null; S._fpc=null; S.membros=m.data||[]; S.inst=i.data||[]; S.contas=(c.data||[]).filter(x=>x.ativo); S.cartoes=(k.data||[]).filter(x=>x.ativo);
  S.grupos=g.data||[]; S.cats=ca.data||[]; S.lanc=l.data||[];
  if(S.parcOK===undefined){ const pr=await sb.from("lancamentos").select("compra_id").eq("familia_id",fid).limit(1); S.parcOK=!pr.error; }
  if(S.perfilOK===undefined){ const pr=await sb.from("membros").select("avatar_url").eq("familia_id",fid).limit(1); S.perfilOK=!pr.error; }
  if(S.grupoOK===undefined){ const pr=await sb.from("contas").select("grupo_id").eq("familia_id",fid).limit(1); S.grupoOK=!pr.error; }
  const cx=await sb.from("conexoes_pluggy").select("*").eq("familia_id",fid); S.conexoes=cx.error?[]:(cx.data||[]);
  S.rendas=(rd.data||[]).filter(x=>x.ativo!==false); S.despesas=(df.data||[]).filter(x=>x.ativo!==false);
  const p = await sb.from("projecoes").select("*").eq("familia_id",fid);
  S.projs = p.data||[];
  const meu = S.projs.find(x=>x.user_id===S.user.id);
  S.proj = Object.assign(projPadrao(), meu?.dados||{});
}

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user || null;
  if(!S.user) return renderAuth();
  const {data:mem} = await sb.from("membros").select("familia_id, familias(*)").eq("user_id",S.user.id).limit(1);
  if(!mem || !mem.length) return renderOnboarding();
  S.fam = mem[0].familias;
  await carregar(); render();
  aplicarRegrasCat().then(n=>{ if(n){ render(); } }).catch(()=>{});
  if(!DEMO && (S.conexoes||[]).length && !S.autoSync){ S.autoSync=true; let ult=0; try{ult=Number(localStorage.getItem("cf-sync-"+S.fam.id)||0);}catch(e){}
    const maisRecente=Math.max(ult,...S.conexoes.map(c=>c.ultima_sync?new Date(c.ultima_sync).getTime():0));
    if(Date.now()-maisRecente>12*36e5) sincronizarBancos(); }
}

/* ---------- PROJEÇÃO / FECHAMENTO ---------- */
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function projPadrao(){ return { reajuste:5, mesReajuste:4, inflacao:4.5, meses:12, saldoInicial:null, variavel:null }; }
S.sim = { ajuste:0, extraValor:0, extraMes:1 };
S.fech = "0";

function liquidoAtual(){ return filtro(S.contas).filter(c=>c.tipo!=="investimento").reduce((s,c)=>s+Number(c.saldo),0); }

/* ---- movimentações internas: pagar fatura, aplicar/resgatar investimento, Pix entre contas próprias.
   Não são gasto nem renda: ficam fora das médias, totais e projeções. ---- */
const normTxt=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function nomesProprios(){
  if(S._nomes) return S._nomes;
  const md=S.user?.user_metadata||{};
  const n=[...S.membros.map(m=>m.nome_completo||""),md.full_name||"",md.name||""].filter(Boolean);
  return S._nomes=n.map(s=>normTxt(s).split(/\s+/).filter(t=>t.length>2)).filter(a=>a.length>=2);
}
const chaveDesc=s=>normTxt(s).replace(/\s*\(\d+\/\d+\)\s*$/,"").replace(/\s+/g," ").trim();
/* chave para juntar compras iguais: tira parcelas ("PARC 05/06", "(5/6)", "3 de 10"), números e sufixos de país */
const chaveGrupo=s=>{ const k=normTxt(String(s||"").split("|").pop()).replace(/\(\d+\/\d+\)/g," ").replace(/\bparc(ela)?\.?\s*\d+\s*(\/|de)\s*\d+/g," ")
  .replace(/\b\d+\s*(\/|de)\s*\d+\b/g," ").replace(/\d+/g," ").replace(/[^a-z ]/g," ").replace(/\b(br|bra|parc|parcela)\b/g," ").replace(/\s+/g," ").trim(); return k||chaveDesc(s); };
/* nome para mostrar, sem a marca da parcela */
const nomeLimpo=s=>String(s||"").split("|").map(t=>t.trim()).filter(Boolean).pop().replace(/\s*\(\d+\/\d+\)\s*$/,"").replace(/\s*PARC(ELA)?\.?\s*\d+\s*\/\s*\d+/i,"").replace(/\s+\d+\s*\/\s*\d+\s*$/,"").replace(/\s+/g," ").trim();
function ehInterno(l){
  const d=normTxt(l.descricao);
  if(((S.proj&&S.proj.ignorar)||[]).includes(chaveDesc(l.descricao))) return true;   // marcado por você como "não é gasto"
  if(/pagamento de fatura|pagamento recebido|pagto\.? fatura|pgto\.? fatura|pagamento fatura|aplicacao|resgate|\brdb\b|\bcdb\b|tesouro|caixinha|cofrinho|guardado|investimento|investment|compra de acoes|venda de acoes|\bfii\b|bloqueio|estorno/.test(d)) return true;
  const cp=d.includes("|")?d.split("|").slice(1).join(" "):d;           // contraparte: nome depois do "|" ou a descrição toda (ex.: "Pix enviado para ...", ou só o nome)
  return nomesProprios().some(tok=>tok.filter(t=>cp.includes(t)).length>=Math.min(2,tok.length) && cp.includes(tok[0]));
}
/* empréstimos e financiamentos pagos todo mês (achados nos lançamentos do banco) — entram como contas a pagar */
const chaveRec=s=>normTxt(s).replace(/s\/a/g,"sa").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const RE_EMPREST=/votorantim|parcela paga|emprestimo|financiamento|prestacao|consorcio|ademicon|credito pessoal|consignado/;
function recorrentesDetectados(){
  if(S._rec) return S._rec;
  const hoje=new Date(), mesAt=iso(hoje).slice(0,7), d0=new Date(hoje.getFullYear(),hoje.getMonth()-4,1,12), ini=iso(d0);
  const cad=S.despesas.map(d=>chaveRec(d.descricao));
  const g={};
  (S.lanc||[]).filter(l=>l.tipo==="despesa"&&!l.cartao_id&&l.data>=ini&&RE_EMPREST.test(normTxt(l.descricao))).forEach(l=>{
    const k=chaveRec(l.descricao); (g[k]=g[k]||[]).push(l); });
  const out=[];
  Object.entries(g).forEach(([k,ls])=>{
    const meses=new Set(ls.map(l=>l.data.slice(0,7)));
    const anteriores=[...meses].filter(m=>m<mesAt);
    if(anteriores.length<2) return;                                   // precisa repetir em pelo menos 2 meses
    if(cad.some(c=>c&&(c.includes(k)||k.includes(c)))) return;        // já cadastrado em Gastos fixos
    if(((S.proj&&S.proj.ignorar)||[]).includes(chaveDesc(ls[0].descricao))) return;
    ls.sort((a,b)=>b.data.localeCompare(a.data)); const u=ls[0];
    const desc=u.descricao.split("|").map(x=>x.trim()).filter(Boolean).pop();
    out.push({id:"auto:"+k, descricao:(/parcela paga/i.test(u.descricao)?"Empréstimo · ":/votorantim/i.test(u.descricao)?"Financiamento · ":"")+desc,
      valor:Number(u.valor), dia:Number(u.data.slice(8,10)), parcelas_restantes:null, origem:"auto", auto:true,
      grupo_id:u.grupo_id||null, titular_id:u.user_id, categoria_id:null, chave:k,
      pagoMes0:meses.has(mesAt) || (((S.proj&&S.proj.pagos)||{})[k]===mesAt)});
  });
  return S._rec=out;
}
// contas do mês = só o que você cadastra em Gastos fixos (a detecção automática ficou desligada)
const despesasTodas=()=>S.despesas;
/* contas marcadas como pagas: S.proj.pagos["<id>|AAAA-MM"]=true */
const mesKeyOff=o=>{ const h=new Date(); return iso(new Date(h.getFullYear(),h.getMonth()+o,1,12)).slice(0,7); };
const pagoEm=(id,mk)=>marca(id,mk)===true;

const ehParcela=l=>l.parcela_total>1 || /\(\d+\/\d+\)\s*$/.test(l.descricao||"");

/* médias mensais (últimos 90 dias até hoje), sem internos e sem parcelas (parcelas entram uma a uma) */
/* pagamento de empréstimo já coberto por um gasto fixo importado do banco: fica fora da média para não contar duas vezes */
function ehPagEmprestimo(l){
  if(!filtro(despesasTodas()).some(d=>d.origem==="pluggy"||d.auto)) return false;
  return /parcela paga|pagamento de emprestimo|pagamento emprestimo|emprestimo|financiamento|prestacao/.test(normTxt(l.descricao));
}
function estimativas(){
  const hj=iso(new Date()), d0=new Date(); d0.setDate(d0.getDate()-90); const ini=iso(d0);
  const fixas=new Set(S.cats.filter(c=>/contas fixas|moradia/i.test(c.nome)).map(c=>c.id));
  const todos=filtro(S.lanc,"user_id").filter(l=>l.data>=ini&&l.data<=hj);
  const ls=todos.filter(l=>l.tipo==="despesa"&&!ehInterno(l)&&!ehParcela(l)&&!ehPagEmprestimo(l));
  const primeira=todos.reduce((m,l)=>l.data<m?l.data:m,hj);
  const meses=Math.max(1,Math.min(3,(new Date(hj)-new Date(primeira))/864e5/30));
  const conta=ls.filter(l=>!l.cartao_id&&!fixas.has(l.categoria_id)).reduce((s,l)=>s+Number(l.valor),0)/meses;
  const cartao={}; ls.filter(l=>l.cartao_id).forEach(l=>{ cartao[l.cartao_id]=(cartao[l.cartao_id]||0)+Number(l.valor)/meses; });
  return {conta,cartao};
}
function mediaVariavel(){ const e=estimativas(); return e.conta+Object.values(e.cartao).reduce((a,b)=>a+b,0); }
const vazio=v=>v===null||v===undefined||v==="";
/* valor digitado na Projeção vale para "Todos" (reparte entre conta e cartões); com filtro usa a média real do filtro */
function divisaoVariavel(){
  // sem estimativas automáticas: só entra gasto do dia a dia se o usuário digitar um valor na Projeção
  if(!S.proj || vazio(S.proj.variavel) || S.pessoa!=="todos") return {conta:0,cartao:{}};
  const e=estimativas();
  const alvo=Number(S.proj.variavel), tot=e.conta+Object.values(e.cartao).reduce((a,b)=>a+b,0);
  if(tot<=0) return {conta:alvo,cartao:{}};
  const k=alvo/tot; return {conta:e.conta*k,cartao:Object.fromEntries(Object.entries(e.cartao).map(([i,v])=>[i,v*k]))};
}
function variavelMes(){ const e=divisaoVariavel(); return e.conta+Object.values(e.cartao).reduce((a,b)=>a+b,0); }

/* ---- cartões: em que mês (0 = este) cada fatura é paga ---- */
/* dia de fechamento: o do banco ou, se não vier, 7 dias antes do vencimento */
function diaFech(c){ const f=Number(c.dia_fechamento)||0; if(f) return f; const dv=Number(c.dia_vencimento)||0; if(!dv) return 0; const x=dv-7; return x>=1?x:x+30; }
function mesFaturaAtual(c,hd){ const dv=Number(c.dia_vencimento)||0; return (!dv||dv>hd)?0:1; }
function mesPagamento(c,dataIso,hoje){
  const d=new Date(dataIso+"T12:00:00"), fech=diaFech(c), dv=Number(c.dia_vencimento)||0;
  let off=(d.getFullYear()-hoje.getFullYear())*12+(d.getMonth()-hoje.getMonth());
  if(fech && d.getDate()>fech) off+=1;          // depois do fechamento -> próxima fatura
  if(!fech || (dv && dv<=fech)) off+=1;          // vencimento cai no mês seguinte ao fechamento
  return off;
}
function fracaoAteFechar(c,hoje){
  const fech=diaFech(c); if(!fech) return .5;
  let alvo=new Date(hoje.getFullYear(),hoje.getMonth(),fech,12); if(alvo<=hoje) alvo=new Date(hoje.getFullYear(),hoje.getMonth()+1,fech,12);
  return Math.min(1,Math.max(0,(alvo-hoje)/864e5/30));
}
/* faturas previstas por cartão e mês: {cartaoId:{m:{valor, atual, estimado, parcelas}}} */
/* ciclo da fatura que vence no mês m (0 = este): compras em (ini, fim], vence em "vence" */
function dataDia(y,mo,d){ const last=new Date(y,mo+1,0).getDate(); return new Date(y,mo,Math.min(d,last),12); }
function cicloFatura(c,m){
  const venc=Number(c.dia_vencimento)||0; if(!venc) return null;
  const h=new Date(), fech=diaFech(c)||Math.max(1,venc-7), y=h.getFullYear(), mo=h.getMonth()+m, off=fech<venc?0:-1;
  return {ini:iso(dataDia(y,mo+off-1,fech)), fim:iso(dataDia(y,mo+off,fech)), vence:iso(dataDia(y,mo,venc)), venceAnt:iso(dataDia(y,mo-1,venc))};
}
const ehPagCartao=l=>l.tipo==="receita"&&/pagamento|pagto|pgto|pag fatura/.test(normTxt(l.descricao));
/* faturas por cartão e mês. Cartão do banco: soma as compras do ciclo (o "saldo" do banco é o limite usado e inclui parcelas futuras,
   por isso não serve como fatura). Cartão manual: fatura digitada + parcelas lançadas. */
function faturasPrevistas(nMeses,aj=1){
  const ck=nMeses+"|"+aj+"|"+S.pessoa; S._fpc=S._fpc||{}; if(S._fpc[ck]) return S._fpc[ck];
  const hoje=new Date(); hoje.setHours(12,0,0,0); const hd=hoje.getDate(), p=S.proj, hj=iso(hoje);
  const est=divisaoVariavel(), out={};
  filtro(S.cartoes).forEach(c=>{
    const media=est.cartao[c.id]||0, f={}, banco=(c.origem==="pluggy"||!!c.pluggy_account_id)&&!!Number(c.dia_vencimento);   // sem dia de vencimento não dá para montar o ciclo
    const tx=S.lanc.filter(l=>l.cartao_id===c.id);
    for(let m=0;m<nMeses;m++){
      const inf=Math.pow(1+Number(p.inflacao)/100,m/12), cy=cicloFatura(c,m);
      if(banco){
        if(cy.vence<hj) continue;                                  // já venceu
        const itens=tx.filter(l=>l.data>cy.ini&&l.data<=cy.fim);
        const soma=a=>a.reduce((s,l)=>s+Number(l.valor),0);
        const compras=soma(itens.filter(l=>l.tipo==="despesa"&&!ehParcela(l))), parcelas=soma(itens.filter(l=>l.tipo==="despesa"&&ehParcela(l)));
        const creditos=soma(itens.filter(l=>l.tipo==="receita"&&!ehPagCartao(l)));
        const pagos=tx.filter(l=>ehPagCartao(l)&&l.data>cy.venceAnt&&l.data<=cy.vence), pagoBanco=soma(pagos);
        const aberta=cy.fim>=hj, estimado=aberta?media*inf*aj*(cy.ini<hj?fracaoAteFechar(c,hoje):1):0;
        const total=Math.max(0,compras+parcelas-creditos)+estimado, valor=Math.max(0,total-pagoBanco);
        f[m]={ciclo:cy,itens,compras,parcelas,creditos,pagoBanco,estimado,total,valor,aberta,atual:Math.max(0,compras-creditos),
          autoPaga: total>0.5&&valor<=0.5, dataPag: pagos.map(l=>l.data).sort().pop()||null};
      } else {
        const md=mesFaturaAtual(c,hd); if(m<md) continue;
        const atual=m===md?Number(c.fatura_atual)||0:0, estimado=m===md?media*inf*aj*fracaoAteFechar(c,hoje):media*inf*aj;
        f[m]={ciclo:cy,itens:[],compras:atual,parcelas:0,creditos:0,pagoBanco:0,estimado,aberta:true,atual,autoPaga:false};
      }
    }
    if(!banco){ const md=mesFaturaAtual(c,hd);
      tx.filter(l=>l.data>hj&&l.tipo==="despesa"&&!ehInterno(l)).forEach(l=>{ const m=Math.max(md,mesPagamento(c,l.data,hoje)); if(f[m]){ f[m].parcelas+=Number(l.valor); f[m].itens.push(l); } });
      Object.values(f).forEach(x=>{ x.total=x.compras+x.parcelas+x.estimado; x.valor=x.total; }); }
    Object.values(f).forEach(x=>{ ["compras","parcelas","creditos","pagoBanco","estimado","total","valor"].forEach(k=>{ x[k]=Number(x[k]); if(!isFinite(x[k])) x[k]=0; }); });
    Object.entries(f).forEach(([m,x])=>{ const mm=marca("fat:"+c.id, mesKeyOff(Number(m)));
      x.paga = mm!==null ? mm : x.autoPaga; x.pagaValor=x.total; });
    out[c.id]=f;
  });
  return S._fpc[ck]=out;
}


function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(Math.abs(r)||1))), f=r/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function abrev(v){ const a=Math.abs(v), s=v<0?"−":""; return a>=1e6? s+"R$ "+(a/1e6).toFixed(1).replace(".",",")+" mi" : a>=1e3? s+"R$ "+(a/1e3).toFixed(a>=1e4?0:1).replace(".",",")+" mil" : s+"R$ "+a.toFixed(0); }
function escala(vals, H, T, B, forcaZero){
  let lo=Math.min(...vals), hi=Math.max(...vals); if(forcaZero){lo=Math.min(lo,0);hi=Math.max(hi,0);}
  if(hi===lo){hi+=500;lo-=500;} const pad=(hi-lo)*.08; if(!forcaZero){lo-=pad;hi+=pad;}
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  return {lo,hi,step,y:v=>T+(hi-v)/(hi-lo)*(H-T-B)};
}
function largura(id){ return Math.max(320,Math.min(980,($("#"+id)?.clientWidth)||720)); }

/* gráfico diário do fechamento (linha) */
function diarioSVG(dias, W){
  const H=W<500?220:250, L=W<500?60:68, R=W<500?62:84, T=18, B=28, n=dias.length;
  const sc=escala(dias.map(d=>d.saldo),H,T,B,false), x=i=>L+(n<2?0:i/(n-1))*(W-L-R);
  let g="";
  for(let v=sc.lo; v<=sc.hi+1e-6; v+=sc.step) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sc.y(v)}" y2="${sc.y(v)}"/><text x="${L-8}" y="${sc.y(v)+4}" text-anchor="end">${abrev(v)}</text>`;
  if(sc.lo<0&&sc.hi>0) g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sc.y(0)}" y2="${sc.y(0)}"/>`;
  const pts=dias.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${sc.y(d.saldo).toFixed(1)}`).join("");
  g+=`<path class="a-sim" d="${pts}L${x(n-1)},${H-B}L${x(0)},${H-B}Z"/><path class="l-sim" d="${pts}"/>`;
  const passo = n>40?7:(W<500?7:3); let lx=-1e9;
  dias.forEach((d,i)=>{
    const dia=d.d.getDate(), ult=new Date(d.d.getFullYear(),d.d.getMonth()+1,0).getDate()===dia;
    if((i===0||dia===1||(dia-1)%passo===0) && x(i)-lx>=(W<500?52:58) && x(i)<=W-R-20){ lx=x(i); g+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${dia} ${MESES[d.d.getMonth()]}</text>`; }
    if(d.ev) g+=`<circle class="evt" cx="${x(i)}" cy="${sc.y(d.saldo)}" r="2.5"/>`;
    if(ult && i>0){ g+=`<line class="zero" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}"/><circle class="end" cx="${x(i)}" cy="${sc.y(d.saldo)}" r="5"/>`;
      const fimDir=i===n-1; g+=`<text class="endt" x="${fimDir?x(i)+9:x(i)-8}" y="${sc.y(d.saldo)-9}" text-anchor="${fimDir?"start":"end"}">${abrev(d.saldo)}</text>`; }
  });
  g+=`<circle class="hoje" cx="${x(0)}" cy="${sc.y(dias[0].saldo)}" r="4"/><text class="endt" x="${x(0)+8}" y="${sc.y(dias[0].saldo)-9}">hoje</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo previsto dia a dia">${g}</svg>`;
}
/* gráfico mensal do fechamento (barras) */
function mensalSVG(meses, W){
  const H=W<500?220:250, L=W<500?60:68, R=16, T=24, B=28, n=meses.length;
  const sc=escala(meses.map(m=>m.saldo),H,T,B,true), bw=Math.min(54,(W-L-R)/n*0.62), x=i=>L+(i+.5)*(W-L-R)/n;
  let g="";
  for(let v=sc.lo; v<=sc.hi+1e-6; v+=sc.step) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sc.y(v)}" y2="${sc.y(v)}"/><text x="${L-8}" y="${sc.y(v)+4}" text-anchor="end">${abrev(v)}</text>`;
  const every=Math.ceil(n/(W<500?6:12));
  meses.forEach((m,i)=>{ const y0=sc.y(0), y1=sc.y(m.saldo);
    g+=`<rect class="${m.saldo<0?"bar-n":"bar-p"}" x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3"/>`;
    if(n<=6||i%every===0||i===n-1) g+=`<text class="lbl" x="${x(i)}" y="${m.saldo<0?y1+14:y1-6}" text-anchor="middle">${abrev(m.saldo)}</text>`;
    if(i%every===0||i===n-1) g+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${m.label}</text>`; });
  g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sc.y(0)}" y2="${sc.y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de fechamento por mês">${g}</svg>`;
}

}
/* o que compõe a média de débito/Pix — e marcar o que não é gasto */
function modalDebito(){
  const hj=iso(new Date()), d0=new Date(); d0.setDate(d0.getDate()-90); const ini=iso(d0);
  const fixas=new Set(S.cats.filter(c=>/contas fixas|moradia/i.test(c.nome)).map(c=>c.id));
  const meses=Math.max(1,Math.min(3,(new Date(hj)-new Date(filtro(S.lanc,"user_id").filter(l=>l.data>=ini&&l.data<=hj).reduce((m,l)=>l.data<m?l.data:m,hj)))/864e5/30));
  const base=filtro(S.lanc,"user_id").filter(l=>l.tipo==="despesa"&&!l.cartao_id&&l.data>=ini&&l.data<=hj&&!ehParcela(l)&&!fixas.has(l.categoria_id)&&!ehPagEmprestimo(l));
  const grupos={}; base.filter(l=>!ehInterno(l)).forEach(l=>{ const k=chaveDesc(l.descricao); (grupos[k]=grupos[k]||{k,desc:l.descricao,n:0,v:0}); grupos[k].n++; grupos[k].v+=Number(l.valor); });
  const lista=Object.values(grupos).sort((a,b)=>b.v-a.v), ign=(S.proj.ignorar||[]);
  const tot=lista.reduce((s,g)=>s+g.v,0)/meses;
  abrir(`<h2>Débito/Pix do dia a dia</h2>
    <p class="muted" style="margin:0;font-size:.85rem">Média de <b>${brl(tot)}/mês</b> (últimos ${Math.round(meses*30)} dias, saídas da conta). Já ficam de fora: pagamento de fatura, aplicações/resgates, Pix entre suas contas e parcelas. Se algo abaixo não é gasto de verdade (ex.: transferência para outra conta sua), toque em <b>Não é gasto</b>.</p>
    <div class="list" style="max-height:52vh;overflow:auto">${lista.map(g=>`<div class="item"><div class="dot">${ic("arrow-up-right")}</div>
      <div><div class="t">${esc(g.desc)}</div><div class="m">${g.n}× · ${brl(g.v)} no período · ~${brl(g.v/meses)}/mês</div></div>
      <div class="r"><button class="btn ghost sm" data-ign="${esc(g.k)}">Não é gasto</button></div></div>`).join("")||`<div class="empty">Nada no período.</div>`}</div>
    ${ign.length?`<details><summary class="link" style="cursor:pointer">${ign.length} ${ign.length===1?"item marcado":"itens marcados"} como "não é gasto"</summary><div class="list">${ign.map(k=>`<div class="item"><div class="dot">${ic("eye-off")}</div><div><div class="t">${esc(k)}</div></div><div class="r"><button class="btn ghost sm" data-design="${esc(k)}">Voltar a contar</button></div></div>`).join("")}</div></details>`:""}
    <div class="row-end"><button class="btn" data-close>Pronto</button></div>`, ()=>{
    const salvar=()=>{ salvarProj(); fechar(); render(); modalDebito(); };
    document.querySelectorAll("[data-ign]").forEach(b=>b.onclick=()=>{ S.proj.ignorar=[...new Set([...(S.proj.ignorar||[]),b.dataset.ign])]; salvar(); toast("Marcado como não é gasto"); });
    document.querySelectorAll("[data-design]").forEach(b=>b.onclick=()=>{ S.proj.ignorar=(S.proj.ignorar||[]).filter(k=>k!==b.dataset.design); salvar(); });
  });
}
/* de onde vem o saldo final: soma dos componentes dos meses do período */
function quebraHTML(s0, ms, alvo){
  const soma=k=>ms.reduce((s,m)=>s+((m.comp&&m.comp[k])||0),0), fat={}, mesDe={};
  ms.forEach(m=>Object.entries((m.comp&&m.comp.faturas)||{}).forEach(([id,v])=>{ fat[id]=(fat[id]||0)+v; if(mesDe[id]===undefined) mesDe[id]=m.m; }));
  const linha=(rot,v)=>`<div class="qrow"><span>${rot}</span><span class="num ${v<0?"neg":v>0?"pos":""}">${v>0?"+":v<0?"−":""} ${brl(Math.abs(v))}</span></div>`;
  const linhas=[`<div class="qrow"><span>Disponível hoje</span><span class="num">${brl(s0)}</span></div>`];
  if(soma("rendas")) linhas.push(linha("Entradas a receber (não marcadas)",soma("rendas")));
  if(soma("futRec")) linhas.push(linha("Entradas já lançadas",soma("futRec")));
  Object.entries(fat).filter(([,v])=>v>0.005).forEach(([id,v])=>{ const c=S.cartoes.find(x=>x.id===id)||{};
    linhas.push(`<div class="qrow"><span>Fatura ${esc(c.instituicao||"")} · ${esc(c.nome||"cartão")} <button class="link" data-ver-fatura="${mesDe[id]}">ver itens</button></span><span class="num neg">− ${brl(v)}</span></div>`); });
  if(soma("fixos")) linhas.push(linha("Contas a pagar (não marcadas)",-soma("fixos")));
  if(soma("debito")) linhas.push(linha("Gasto do dia a dia (valor que você digitou na Projeção)",-soma("debito")));
  if(soma("futDesp")) linhas.push(linha("Saídas já lançadas na conta",-soma("futDesp")));
  if(soma("extra")) linhas.push(linha("Gasto extra simulado",-soma("extra")));
  linhas.push(`<div class="qrow tot"><span>${esc(alvo.label)} fecha em</span><span class="num ${alvo.saldo<0?"neg":""}">${brl(alvo.saldo)}</span></div>`);
  const modo="";
  return `<details class="quebra"><summary>De onde vem esse valor</summary>${modo}${linhas.join("")}</details>`;
}

/* ---------- SOBRA DO MÊS (entradas − saídas, no mês selecionado) ---------- */
function calcSobra(){
  // mesma base do "Fechamento previsto": dinheiro que entra e sai da conta (fatura do cartão conta no dia do pagamento)
  const r=mesRef(), o=S.mes, hoje=new Date(); hoje.setHours(12,0,0,0); const hj=iso(hoje);
  const passado=o<0, atual=o===0, lim=passado?r.fim:(atual?hj:null);
  const ehPagFatura=l=>/pagamento de fatura|pagamento fatura|pagto fatura|fatura do cartao|pagamento cartao/.test(normTxt(l.descricao));
  const real=lim?filtro(S.lanc,"user_id").filter(l=>!l.cartao_id&&l.data>=r.ini&&l.data<=lim&&(!ehInterno(l)||(l.tipo==="despesa"&&ehPagFatura(l)))):[];
  const eR=real.filter(l=>l.tipo==="receita").reduce((s,l)=>s+Number(l.valor),0);
  const sR=real.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+Number(l.valor),0);
  let eP=0,sP=0;
  if(!passado){ const m=motor(o+1).meses[o]; if(m){ eP=m.rec; sP=m.gas; } }
  return {r,passado,atual,eR,sR,eP,sP,E:eR+eP,S:sR+sP};
}
function secSobra(){
  const x=calcSobra(), sobra=x.E-x.S, pct=x.E>0?Math.min(100,x.S/x.E*100):(x.S>0?100:0);
  const det=(real,prev,a,b)=> x.passado?a:(x.atual?`${brl(real)} ${a} + ${brl(prev)} ${b}`:b);
  return `<section class="panel">
    <div class="sec-h"><h2>Sobra de ${x.r.nome}</h2><span class="pill">${x.passado?"mês fechado":x.atual?"realizado + previsto até o fim do mês":"previsão"}</span></div>
    <div class="kpis">

/* ---------- FATURAS DOS CARTÕES (mês selecionado no topo) ---------- */
function cicloAtual(c){
  const hoje=new Date(); hoje.setHours(12,0,0,0); const fech=diaFech(c);
  if(!fech) return null;
  let prox=new Date(hoje.getFullYear(),hoje.getMonth(),fech,12); if(prox<=hoje) prox=new Date(hoje.getFullYear(),hoje.getMonth()+1,fech,12);
  const ant=new Date(prox.getFullYear(),prox.getMonth()-1,fech,12);
  return {ini:iso(new Date(ant.getTime()+864e5)), fim:iso(prox)};
}
function secFaturas(){
  const o=Math.max(0,S.mes), r=mesRef(o), cartoes=filtro(S.cartoes), hj=iso(new Date()), fat=faturasPrevistas(o+1);
  if(!cartoes.length) return "";
  const linhaL=l=>`<div class="item"><div class="dot">${ic((S.cats.find(x=>x.id===l.categoria_id)||{}).icone||"tag")}</div>
      <div><div class="t">${esc(l.descricao.replace(/\s*\(\d+\/\d+\)$/,""))}</div><div class="m">${dt(l.data)}${parcTxt(l)?" · parcela "+parcTxt(l).replace("/"," de "):""}</div></div>
      <div class="r"><div class="amt ${l.tipo==="receita"?"pos":"neg"}">${l.tipo==="receita"?"+":"−"} ${brl(l.valor)}</div></div></div>`;
  let total=0;
  const blocos=cartoes.map(c=>{
    const f=fat[c.id]&&fat[c.id][o], cy=f&&f.ciclo||cicloFatura(c,o), tit=`${esc(c.instituicao||"")} · ${esc(c.nome)}`, banco=c.origem==="pluggy"||!!c.pluggy_account_id;
    if(!f||f.total<=0.005) return `<div class="fat"><div class="fat-h"><div><div class="t">${tit}</div><div class="m">${cy&&cy.vence<hj?`A fatura de ${r.nome} já venceu (dia ${Number(cy.vence.slice(8))}).`:`Nada para pagar em ${r.nome}.`}</div></div><div class="amt">${brl(0)}</div></div></div>`;
    if(!f.paga) total+=f.valor;
    const btn=`<button class="btn ${f.paga?"ghost":""} sm" data-rec-pago="fat:${c.id}" data-rmes="${mesKeyOff(o)}" data-v="${f.paga?0:1}">${ic(f.paga?"rotate-ccw":"circle-check","ico",14)} ${f.paga?"Desmarcar":"Marcar como paga"}</button>`;
    const pill=f.paga?`<span class="pill" style="background:var(--pos-soft);color:var(--pos)">${f.autoPaga&&marca("fat:"+c.id,mesKeyOff(o))===null?"paga no banco":"paga"}</span>`:`<span class="pill ${f.aberta?"auto":""}">${f.aberta?"aberta":"fechada"}</span>`;
    const nota=cy?`${banco?`Compras de ${dt(iso(new Date(new Date(cy.ini+"T12:00:00").getTime()+864e5)))} a ${dt(cy.fim)} · `:""}${f.aberta?"fecha":"fechou"} ${dt(cy.fim)} · vence ${dt(cy.vence)}`:"";
    const compras=f.itens.filter(l=>!ehParcela(l)&&!ehPagCartao(l)), parcs=f.itens.filter(l=>ehParcela(l));
    const box=(rot,v,cls)=>`<div><span class="label">${rot}</span><b class="num ${cls||""}">${brl(v)}</b></div>`;
    return `<div class="fat">
      <div class="fat-h"><div><div class="t">${tit} ${pill}</div><div class="m">${nota} · ${esc(nomeMembro(c.titular_id))}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="amt ${f.paga?"":"neg"}" style="font-size:1.15rem">${brl(f.paga?f.total:f.valor)}</div>${btn}</div></div>
      <div class="fat-comp">
        ${banco?box("Compras",f.compras):box("Fatura digitada",f.compras)}
        ${f.parcelas?box("Parcelas",f.parcelas):""}
        ${f.creditos?box("Estornos",-f.creditos,"pos"):""}
        ${f.estimado?box("Previsto até fechar",f.estimado):""}
        ${f.pagoBanco?box("Já pago",-f.pagoBanco,"pos"):""}
      </div>
      ${compras.length?`<details><summary>${compras.length} ${compras.length===1?"compra":"compras"} nesta fatura</summary><div class="list">${compras.sort((a,b)=>b.data.localeCompare(a.data)).map(linhaL).join("")}</div></details>`:""}
      ${parcs.length?`<details><summary>${parcs.length} ${parcs.length===1?"parcela":"parcelas"} nesta fatura · ${brl(f.parcelas)}</summary><div class="list">${parcs.map(linhaL).join("")}</div></details>`:""}
      ${banco&&Number(c.fatura_atual)>f.total+1&&o===0?`<p class="muted" style="margin:0;font-size:.78rem">${ic("info","ico",13)} O banco mostra ${brl(c.fatura_atual)} de limite usado: isso soma esta fatura com as parcelas dos próximos meses, por isso é maior.</p>`:""}
    </div>`;
  }).join("");
  return `<section class="panel" id="faturas">
    <div class="sec-h"><h2>Faturas que vencem em ${r.nome}</h2><span class="amt neg">${brl(total)}</span></div>
    <p class="muted" style="margin:0;font-size:.82rem">Troque o mês no topo para ver as próximas faturas e as parcelas de cada uma.</p>
    ${blocos}</section>`;
}

function chartSVG(base, sim, s0, W){
  const H=W<500?240:300, L=W<500?64:70, R=W<500?54:70, T=16, B=34, n=sim.length;
  const sc=escala([s0,...sim.map(x=>x.saldo),...base.map(x=>x.saldo)],H,T,B,true);
  const barMax=Math.max(...sim.map(x=>Math.max(x.rec,x.gas)),1);
  const x=i=>L+(i+0.5)*((W-L-R)/n), y=sc.y, bw=Math.max(2,((W-L-R)/n)*0.32), by=v=>H-B-(v/barMax)*(H-T-B)*0.35;
  let g="";
  for(let v=sc.lo; v<=sc.hi+1e-6; v+=sc.step) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${abrev(v)}</text>`;
  if(sc.lo<0&&sc.hi>0) g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  const every=Math.ceil(n/(W<500?6:12));
  sim.forEach((d,i)=>{ g+=`<rect class="b-r" x="${x(i)-bw}" y="${by(d.rec)}" width="${bw}" height="${H-B-by(d.rec)}"/><rect class="b-g" x="${x(i)}" y="${by(d.gas)}" width="${bw}" height="${H-B-by(d.gas)}"/>`;
    if(i%every===0) g+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${d.label}</text>`; });
  const path=arr=>arr.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.saldo).toFixed(1)}`).join("");
  const ps=path(sim), yb=y(Math.max(sc.lo,0));
  g+=`<path class="a-sim" d="${ps}L${x(n-1)},${yb}L${x(0)},${yb}Z"/><path class="l-base" d="${path(base)}"/><path class="l-sim" d="${ps}"/>`;
  const e=sim[n-1]; g+=`<circle class="end" cx="${x(n-1)}" cy="${y(e.saldo)}" r="4.5"/><text class="endt" x="${x(n-1)+8}" y="${y(e.saldo)+4}">${abrev(e.saldo)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo projetado mês a mês">${g}</svg>`;
}
function desenharProj(){

  const medSobra=sim.meses.reduce((s,l)=>s+l.sobra,0)/sim.meses.length;

  $("#pj-res").innerHTML="";
  $("#pj-res").innerHTML = `
    <div class="kpis">
      <div><span class="label">Saldo em ${fim.label}</span><span class="v" style="color:${fim.saldo<0?"var(--neg)":"var(--fg)"}">${brl(fim.saldo)}</span></div>
      <div><span class="label">Sobra média/mês</span><span class="v" style="color:${medSobra<0?"var(--neg)":"var(--pos)"}">${brl(medSobra)}</span></div>

    ${chartSVG(base.meses, sim.meses, sim.s0, largura("pj-res"))}
    <div class="legend"><span><i></i>Saldo simulado</span><span><i class="b"></i>Saldo sem simulação</span><span><i class="r"></i>Receita</span><span><i class="g"></i>Gastos</span></div>`;
  $("#pj-tb").innerHTML = `<thead><tr><th>Mês</th><th>Receita</th><th>Gastos</th><th>Sobra</th><th>Saldo</th></tr></thead><tbody>${
    sim.meses.map(l=>`<tr><td>${l.label}${l.m===0?" <span class=\"pill\">resto do mês</span>":""}</td><td>${brl(l.rec)}</td><td>${brl(l.gas)}</td><td style="color:${l.sobra<0?"var(--neg)":"var(--pos)"}">${brl(l.sobra)}</td><td style="font-weight:600;color:${l.saldo<0?"var(--neg)":"inherit"}">${brl(l.saldo)}</td></tr>`).join("")}</tbody>`;

/* marcações de pago/recebido: cada pessoa salva no próprio registro de projeção; vale a marcação mais recente do casal */
function marcas(){
  if(S._marcas) return S._marcas;
  const out={}, norm=v=>(v&&typeof v==="object")?v:{v:!!v,t:0};
  (S.projs||[]).forEach(pr=>{ if(pr.user_id===(S.user&&S.user.id)) return;
    Object.entries((pr.dados&&pr.dados.pagos)||{}).forEach(([k,v])=>{ const o=norm(v); if(!out[k]||o.t>out[k].t) out[k]=o; }); });
  Object.entries((S.proj&&S.proj.pagos)||{}).forEach(([k,v])=>{ const o=norm(v); if(!out[k]||o.t>=out[k].t) out[k]=o; });
  return S._marcas=out;
}
const marca=(key,mk)=>{ const o=marcas()[key+"|"+mk]; return o?o.v:null; };
function marcar(key,mk,v){ S.proj.pagos={...(S.proj.pagos||{})}; S.proj.pagos[key+"|"+mk]={v,t:Date.now()}; S._marcas=null; S._agc=null; S._fpc=null; salvarProj(); }

/* em que meses uma conta cadastrada aparece: começa no mês de criado_em; "parcelas_restantes" conta a partir dele */
const mkDe=d=>String(d||"").slice(0,7);
const difMeses=(a,b)=>{ const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); };
function ocorrencia(x,mk){
  const ini=mkDe(x.criado_em)||mesKeyOff(0), k=difMeses(ini,mk);
  if(k<0) return null;
  if(vazio(x.parcelas_restantes)) return {faltam:null};
  const R=Number(x.parcelas_restantes); if(k>=R) return null;
  return {faltam:R-k, total:R, ultima:R-k===1};
}

/* conciliação: no mês atual, procura no extrato um pagamento/recebimento com o mesmo valor perto do vencimento */
function autoPagos(){
  if(S._auto) return S._auto;
  const mk=mesKeyOff(0), hj=iso(new Date()), usados=new Set(), out={};
  const lancs=(S.lanc||[]).filter(l=>!l.cartao_id&&String(l.data).slice(0,7)===mk&&l.data<=hj);
  const casa=(tipo,valor,dia,tol)=>{
    const l=lancs.filter(l=>!usados.has(l.id)&&l.tipo===tipo&&Math.abs(Number(l.valor)-valor)<=Math.max(.5,valor*tol)
      &&Math.abs(Number(l.data.slice(8,10))-dia)<=15&&!(tipo==="receita"&&ehInterno(l)))
      .sort((a,b)=>Math.abs(Number(a.valor)-valor)-Math.abs(Number(b.valor)-valor))[0];
    if(l){ usados.add(l.id); return l; } return null; };
  [...S.despesas].sort((a,b)=>b.valor-a.valor).forEach(x=>{ if(!ocorrencia(x,mk)) return; const l=casa("despesa",Number(x.valor),Number(x.dia),.01); if(l) out[x.id]=l; });
  [...S.rendas].sort((a,b)=>b.valor-a.valor).forEach(x=>{ const l=casa("receita",Number(x.valor),Number(x.dia),.05); if(l) out[x.id]=l; });
  return S._auto=out;
}

/* eventos do mês: rendas, contas, faturas e lançamentos agendados (m = 0 este mês) */
function agenda(nMeses, aj=1){
  const ck=nMeses+"|"+aj+"|"+S.pessoa; S._agc=S._agc||{}; if(S._agc[ck]) return S._agc[ck];
  const p=S.proj, hoje=new Date(); hoje.setHours(12,0,0,0); const hd=hoje.getDate(), hj=iso(hoje);
  const fat=faturasPrevistas(nMeses,aj), auto=autoPagos(), ev=[];
  const futuros=filtro(S.lanc,"user_id").filter(l=>l.data>hj&&!l.cartao_id&&!ehInterno(l));
  let fator=1;
  for(let m=0;m<nMeses;m++){
    const first=new Date(hoje.getFullYear(),hoje.getMonth()+m,1,12), mes=first.getMonth(), last=new Date(first.getFullYear(),mes+1,0,12).getDate(), mk=iso(first).slice(0,7);
    if(m>0 && mes===Number(p.mesReajuste)) fator*=1+Number(p.reajuste)/100;
    const inf=Math.pow(1+Number(p.inflacao)/100,m/12);
    const add=e=>{ const mm=marca(e.key,mk), a= e.autoPago!==undefined ? !!e.autoPago : m===0&&!!(e.autoId&&auto[e.autoId]);
      e.pago= mm!==null?mm:a; e.auto= mm===null&&a; e.autoL= e.auto?(e.autoL||auto[e.autoId]):null;
      e.valor=Number(e.valor); if(!isFinite(e.valor)) e.valor=0;
      e.m=m; e.mk=mk; e.dia=Math.min(Math.max(1,Number(e.dia)||last),last);
      e.atrasada= m===0&&!e.pago&&e.dia<hd; e.hoje= m===0&&!e.pago&&e.dia===hd; ev.push(e); };
    filtro(S.rendas).forEach(x=>{
      add({kind:"renda",tipo:"receita",key:x.id,autoId:x.id,ref:x,desc:x.descricao,dia:x.dia,valor:Number(x.valor)*(x.tipo==="salario"?fator:1),
        icone:x.tipo==="aluguel"?"key-round":x.tipo==="salario"?"briefcase":"arrow-down-left",quem:x.titular_id});
      if(x.recebe_13&&mes===11) add({kind:"renda",tipo:"receita",key:x.id+":13",ref:x,desc:"13º · "+x.descricao,dia:20,valor:Number(x.valor)*fator,icone:"gift",quem:x.titular_id}); });
    filtro(S.despesas).forEach(x=>{ const oc=ocorrencia(x,mk); if(!oc) return; const cat=S.cats.find(c=>c.id===x.categoria_id);
      add({kind:"conta",tipo:"despesa",key:x.id,autoId:x.id,ref:x,desc:x.descricao,dia:x.dia,valor:Number(x.valor),icone:(cat&&cat.icone)||"receipt-text",quem:x.titular_id,
        parc: oc.faltam===null?"todo mês": oc.ultima?"última parcela": `faltam ${oc.faltam} parcelas`}); });
    filtro(S.cartoes).forEach(c=>{ const f=fat[c.id]&&fat[c.id][m]; if(!f||f.total<=0.005) return;
      const parcial=!f.autoPaga&&f.pagoBanco>0.005;
      add({kind:"fatura",tipo:"despesa",key:"fat:"+c.id,ref:c,desc:"Fatura "+[c.instituicao,c.nome].filter(Boolean).join(" · "),dia:Number(c.dia_vencimento)||last,
        valor: parcial?f.valor:f.total, icone:"credit-card",quem:c.titular_id,f, autoPago:f.autoPaga, autoL:f.autoPaga?{descricao:"pagamento da fatura",data:f.dataPag}:null,
        parc: parcial?`já pagou ${brl(f.pagoBanco)} de ${brl(f.total)}`:(f.ciclo&&f.aberta?`fecha ${dt(f.ciclo.fim)}`:f.ciclo?"fechada":"")}); });
    futuros.filter(l=>l.data.slice(0,7)===mk).forEach(l=>ev.push({kind:"agendado",tipo:l.tipo,key:"l:"+l.id,ref:l,desc:l.descricao.replace(/\s*\(\d+\/\d+\)$/,""),
      dia:Number(l.data.slice(8,10)),valor:Number(l.valor),icone:"calendar-clock",quem:l.user_id,m,mk,pago:false,fixo:true}));
  }
  ev.sort((a,b)=>a.m-b.m||a.dia-b.dia||(a.tipo==="receita"?-1:1));
  return S._agc[ck]=ev;
}

/* motor dia a dia: tudo que está na agenda e ainda não foi pago/recebido; vencido e não pago sai amanhã */
function motor(nMeses, sim){
  const p=S.proj, hoje=new Date(); hoje.setHours(12,0,0,0); const hd=hoje.getDate();
  const aj=1+((sim&&sim.ajuste)||0)/100, varConta=divisaoVariavel().conta;
  const s0 = vazio(p.saldoInicial) ? liquidoAtual() : Number(p.saldoInicial);
  const ag=agenda(nMeses,aj).filter(e=>!e.pago);
  let saldo=s0; const dias=[{d:new Date(hoje),saldo,ev:false}], meses=[];
  for(let m=0;m<nMeses;m++){
    const first=new Date(hoje.getFullYear(),hoje.getMonth()+m,1,12), mes=first.getMonth(), y=first.getFullYear(), last=new Date(y,mes+1,0,12).getDate();
    const inf=Math.pow(1+Number(p.inflacao)/100,m/12), start=m===0?Math.min(hd+1,last):1, vDia=varConta*inf*aj/last;
    const doMes=ag.filter(e=>e.m===m);
    let rec=0,gas=0; const comp={rendas:0,fixos:0,faturas:{},debito:0,futRec:0,futDesp:0,extra:0};
    for(let day=start; day<=last; day++){
      let r=0,g=0;
      doMes.forEach(e=>{ if(Math.max(start,e.dia)!==day) return;
        let v=e.valor; if(e.kind==="conta") v*=aj;
        if(e.tipo==="receita"){ r+=v; if(e.kind==="renda") comp.rendas+=v; else comp.futRec+=v; }
        else { g+=v; if(e.kind==="conta") comp.fixos+=v; else if(e.kind==="fatura") comp.faturas[e.ref.id]=(comp.faturas[e.ref.id]||0)+v; else comp.futDesp+=v; } });
      if(sim && sim.extraValor>0 && m===Number(sim.extraMes) && day===Math.max(start,Math.min(15,last))){ g+=Number(sim.extraValor); comp.extra+=Number(sim.extraValor); }
      const ev=r>0||g>0; g+=vDia; comp.debito+=vDia;
      saldo+=r-g; rec+=r; gas+=g;
      dias.push({d:new Date(y,mes,day,12), saldo, ev, m});
    }
    meses.push({label:MESES[mes]+"/"+String(y).slice(2), rec, gas, sobra:rec-gas, saldo, m, comp});
  }
  return {s0, dias, meses};
}

/* ---------- INÍCIO: o mês até agora (saldo que já tem + o que entrou e saiu de verdade) ---------- */
const ehPagFaturaConta=l=>/pagamento de fatura|pagamento fatura|pagto fatura|fatura do cartao|pagamento cartao|pagamento de cartao/.test(normTxt(l.descricao));
function calcMesReal(o=S.mes){
  const r=mesRef(o), hj=iso(new Date()), fim=o<0?r.fim:hj;
  const ls=o>0?[]:filtro(S.lanc,"user_id").filter(l=>l.data>=r.ini&&l.data<=fim);
  const soma=a=>a.reduce((s,l)=>s+Number(l.valor),0);
  const ent=ls.filter(l=>l.tipo==="receita"&&!l.cartao_id&&!ehInterno(l));
  const sai=ls.filter(l=>l.tipo==="despesa"&&!l.cartao_id&&(!ehInterno(l)||ehPagFaturaConta(l)));   // inclui fatura paga: é dinheiro que saiu da conta
  const pagFat=sai.filter(ehPagFaturaConta);
  const comprasCartao=Math.max(0,soma(ls.filter(l=>l.tipo==="despesa"&&l.cartao_id&&!ehPagCartao(l)))-soma(ls.filter(l=>l.tipo==="receita"&&l.cartao_id&&!ehPagCartao(l))));
  const E=soma(ent), S_=soma(sai);
  return {r,ent,sai,E,S:S_,pagFat:soma(pagFat),comprasCartao};
}

function stTxt(e){
  const hd=new Date().getDate(), rec=e.tipo==="receita";
  if(e.fixo) return {t:"agendado",c:""};
  if(e.pago) return {t:e.auto?(rec?"recebido · achado no extrato":"paga · achada no extrato"):(rec?"recebido":"paga"),c:"ok"};
  if(e.m>0) return {t:"dia "+e.dia,c:""};
  if(e.atrasada){ const d=hd-e.dia; return {t:rec?`atrasado ${d} ${d===1?"dia":"dias"}`:`venceu há ${d} ${d===1?"dia":"dias"}`,c:"late"}; }
  if(e.hoje) return {t:rec?"cai hoje":"vence hoje",c:"today"};
  const d=e.dia-hd; return {t:d===1?"amanhã":`em ${d} dias`,c:d<=3?"today":""};
}

  const n=String(c.nome||"").trim(), m=n.match(/^(CDB|RDB|LCI|LCA|CRI|CRA|LC|LF|Tesouro [A-Za-zÀ-ú]+(?: [A-Za-zÀ-ú]+)?|Poupan[cç]a)\b/i);
  if(m) return m[1]+(c.instituicao?" · "+c.instituicao:"");
  if(n.length>42 && n.includes(" - ")) return n.split(" - ")[0];
  return n;
}
function chaveGrupoConta(c){ return [c.instituicao_id||c.instituicao||"", c.titular_id||"", c.tipo, c.tipo==="investimento"?normTxt(nomeCurto(c)).replace(/\d+/g,""):c.id].join("|"); }
function listaContasHTML(contas){

  if(!S.ctZeradas) l=l.filter(c=>Math.abs(Number(c.saldo))>=0.005||c.tipo==="dinheiro");

  const item=(c,sub)=>`<div class="item${sub?" sub":""}">

  else if(!S.ctAgrupar) corpo=l.map(c=>item(c)).join("");

      return `<details class="cgrp"><summary class="item">

        <div><div class="t">${esc(nomeCurto(c))} <span class="pill">${a.length}</span></div><div class="m">${esc(TIPOS[c.tipo])} · ${esc(c.titular||"")} · ${a.length} ${c.tipo==="investimento"?"aplicações":"contas"}</div></div>

        <div class="list">${a.sort((x,y)=>y.saldo-x.saldo).map(x=>item(x,true)).join("")}</div></details>`; }).join("");
  }

/* =====================================================================
   PROJETOS: "dá para trocar de carro?" — acha o 1º mês em que a parcela cabe
   ===================================================================== */
function projetosTodos(){
  const meus=(S.proj.projetos||[]).map(p=>({...p,dono:S.user.id}));
  const outros=[]; (S.projs||[]).forEach(pr=>{ if(pr.user_id===S.user.id) return; (((pr.dados||{}).projetos)||[]).forEach(p=>outros.push({...p,dono:pr.user_id})); });
  return [...meus,...outros];
}
function salvarProjeto(p){ const l=[...(S.proj.projetos||[])], i=l.findIndex(x=>x.id===p.id); const {dono,...limpo}=p; if(i>=0) l[i]=limpo; else l.push(limpo); S.proj.projetos=l; salvarProj(); }
function excluirProjeto(id){ S.proj.projetos=(S.proj.projetos||[]).filter(x=>x.id!==id); salvarProj(); }
function pessoaDoProjeto(p){ const q=(p.quem||[]).filter(u=>S.membros.some(m=>m.user_id===u)); return (!q.length||q.length>=S.membros.length)?"todos":"p:"+q[0]; }
const pmt=(pv,i,n)=> i>0 ? pv*i/(1-Math.pow(1+i,-n)) : pv/n;   // parcela fixa (tabela Price)
function avaliarProjeto(p){
  const aVista=p.modo==="vista", n=aVista?0:Math.max(0,Number(p.n)||0), parc=aVista?0:Number(p.parcela)||0;
  const ent=Number(aVista?p.valor:p.entrada)||0, res=Number(p.reserva)||0, H=Math.min(84, 36+n);
  const ant=S.pessoa; S.pessoa=pessoaDoProjeto(p); let mo; try{ S._agc=null; S._fpc=null; mo=motor(H); } finally{ S.pessoa=ant; S._agc=null; S._fpc=null; }
  const minMes=Array(H).fill(Infinity); mo.dias.forEach(d=>{ const m=d.m===undefined?0:d.m; if(m<H) minMes[m]=Math.min(minMes[m],d.saldo); });
  for(let i=0;i<H;i++) if(!isFinite(minMes[i])) minMes[i]=mo.meses[i].saldo;
  const custo=(k,i)=> i<k?0: ent+parc*Math.min(n,i-k+1);
  const sobraMedia=mo.meses.slice(0,12).reduce((s,m)=>s+(m.rec-m.gas),0)/Math.min(12,mo.meses.length);
  const baseMin=Math.min(...minMes), baseMinIdx=minMes.indexOf(baseMin);
  let k=null;
  for(let kk=0;kk<H-Math.max(1,n);kk++){ let ok=true; for(let i=kk;i<H;i++){ if(minMes[i]-custo(kk,i)<res){ ok=false; break; } } if(ok){ k=kk; break; } }
  return {k, mo, minMes, H, n, parc, ent, res, custo, sobraMedia, baseMin, baseMinIdx, total:ent+parc*n};
}
const nomeMesOff=o=>{ const r=mesRef(o); return `${r.nome}/${r.ano}`; };
function graficoProjeto(a){
  const ate=Math.min(a.H, (a.k??0)+Math.max(a.n,1)+6), W=640, H=180, L=8, R=8, T=14, B=22;
  const base=a.mo.meses.slice(0,ate).map(m=>m.saldo), com=base.map((v,i)=>a.k===null?null:v-a.custo(a.k,i));
  const vals=[...base,...com.filter(v=>v!==null),a.res,0], lo=Math.min(...vals), hi=Math.max(...vals), sp=(hi-lo)||1;
  const x=i=>L+(ate<2?0:i/(ate-1))*(W-L-R), y=v=>T+(hi-v)/sp*(H-T-B);
  const linha=(arr,cls)=>`<polyline class="${cls}" fill="none" points="${arr.map((v,i)=>v===null?"":`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ")}"/>`;
  let g=`<line class="zero" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  if(a.res>0) g+=`<line class="res" x1="${L}" x2="${W-R}" y1="${y(a.res)}" y2="${y(a.res)}"/>`;
  g+=linha(base,"l-base"); if(a.k!==null) g+=linha(com,"l-com");
  if(a.k!==null) g+=`<line class="mk" x1="${x(a.k)}" x2="${x(a.k)}" y1="${T}" y2="${H-B}"/><text x="${Math.min(W-60,x(a.k)+4)}" y="${T+10}" class="lbl">começa</text>`;
  const step=Math.ceil(ate/6); for(let i=0;i<ate;i+=step) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${a.mo.meses[i].label}</text>`;
  return `<svg class="chart pj-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo previsto com e sem o projeto">${g}</svg>
    <div class="leg"><span><i class="lb"></i>sem o projeto</span>${a.k!==null?`<span><i class="lc"></i>com o projeto</span>`:""}${a.res>0?`<span><i class="lr"></i>reserva mínima</span>`:""}</div>`;
}
function cardProjeto(p){
  const a=avaliarProjeto(p), meu=p.dono===S.user.id, quem=(p.quem&&p.quem.length?p.quem:S.membros.map(m=>m.user_id)).map(nomeMembro).join(" e ");
  const desc= p.modo==="vista" ? `À vista: ${brl(a.ent)}` : `${a.ent?`Entrada ${brl(a.ent)} + `:""}${a.n}x de ${brl(a.parc)}`;
  let titulo, cls, detalhe;
  if(p.aplicado){ titulo=`Em andamento desde ${nomeMesOff(difMeses(mesKeyOff(0),p.aplicado.mk))}`; cls="ok"; detalhe="As parcelas já estão em Contas a pagar."; }
  else if(a.k===0){ titulo="Já dá para começar agora"; cls="ok"; detalhe=`Começando em ${nomeMesOff(0)}, o saldo previsto nunca fica abaixo de ${brl(a.res)}.`; }
  else if(a.k!==null){ titulo=`Dá para começar em ${nomeMesOff(a.k)}`; cls="pos"; detalhe=`Daqui a ${a.k} ${a.k===1?"mês":"meses"}. Antes disso o saldo ficaria abaixo de ${brl(a.res)}.`; }
  else { titulo="Ainda não cabe"; cls="neg";
    detalhe = a.baseMin<a.res ? `Mesmo sem o projeto, o saldo previsto cai para ${brl(a.baseMin)} em ${nomeMesOff(a.baseMinIdx)}. Cadastre todas as entradas ou reduza contas.`
      : `Nos próximos ${Math.round(a.H/12)} anos a parcela não cabe sem passar da reserva. Tente menos parcelas de valor menor, mais entrada guardada ou uma reserva menor.`; }
  const pctSobra = a.sobraMedia>0 && a.parc>0 ? Math.round(a.parc/a.sobraMedia*100) : null;
  return `<article class="panel proj-card">
    <div class="sec-h"><div><h2>${esc(p.nome)}</h2><span class="meta">${esc(desc)} · ${esc(quem)}</span></div>
      <div style="display:flex;gap:4px">${meu?`<button class="iconbtn sm" data-pj-edit="${p.id}" title="Editar" aria-label="Editar">${ic("pencil","ico",14)}</button><button class="iconbtn sm danger" data-pj-del="${p.id}" title="Excluir" aria-label="Excluir">${ic("trash-2","ico",14)}</button>`:`<span class="pill">de ${esc(nomeMembro(p.dono))}</span>`}</div></div>
    <div class="pj-res ${cls}"><b>${titulo}</b><span>${detalhe}</span></div>
    <div class="pj-kpis">
      <div><span class="label">Custo total</span><b>${brl(a.total)}</b></div>
      <div><span class="label">Sua sobra prevista</span><b class="${a.sobraMedia<0?"neg":""}">${brl(a.sobraMedia)}/mês</b></div>
      ${pctSobra!==null?`<div><span class="label">A parcela usa</span><b class="${pctSobra>80?"neg":""}">${pctSobra}% da sobra</b></div>`:""}
      <div><span class="label">Reserva mínima</span><b>${brl(a.res)}</b></div>
    </div>
    ${graficoProjeto(a)}
    ${meu&&!p.aplicado&&a.k!==null&&(a.parc>0||a.ent>0)?`<div class="row-end"><button class="btn sm" data-pj-aplicar="${p.id}" data-k="${a.k}">${ic("calendar-check","ico",14)} Colocar em prática a partir de ${nomeMesOff(a.k)}</button></div>`:""}
  </article>`;
}

S.rel={preset:"mes"};
function periodoRel(){
  const h=new Date(), y=h.getFullYear(), m=h.getMonth(), d=(yy,mm,dd)=>iso(new Date(yy,mm,dd,12));
  const P={ mes:[d(y,m,1),iso(h)], ant:[d(y,m-1,1),d(y,m,0)], tri:[d(y,m-2,1),iso(h)], sem:[d(y,m-5,1),iso(h)], ano:[d(y,0,1),iso(h)], anoant:[d(y-1,0,1),d(y-1,11,31)] };
  if(S.rel.preset==="custom") return [S.rel.de||P.mes[0], S.rel.ate||P.mes[1]];
  return P[S.rel.preset]||P.mes;
}
async function lancPeriodo(de,ate){
  const loc=S.lanc.filter(l=>l.data>=de&&l.data<=ate);
  const maisAntigo=S.lanc.reduce((m,l)=>l.data<m?l.data:m,"9999");
  if(DEMO || S.lanc.length<1000 || de>=maisAntigo) return loc;
  const r=await sb.from("lancamentos").select("*").eq("familia_id",S.fam.id).gte("data",de).lte("data",ate).order("data",{ascending:false}).limit(10000);
  return r.error?loc:(r.data||[]);
}
function analisarPeriodo(ls){
  const soma=a=>a.reduce((s,l)=>s+Number(l.valor),0);
  const ent=ls.filter(l=>l.tipo==="receita"&&!l.cartao_id&&!ehInterno(l));
  const sai=ls.filter(l=>l.tipo==="despesa"&&!l.cartao_id&&(!ehInterno(l)||ehPagFaturaConta(l)));
  // gastos de verdade (para "para onde foi"): débito/Pix/boletos + compras no cartão, sem pagamento de fatura nem movimentação interna
  const gastos=[...ls.filter(l=>l.tipo==="despesa"&&!l.cartao_id&&!ehInterno(l)), ...ls.filter(l=>l.tipo==="despesa"&&l.cartao_id&&!ehPagCartao(l))];
  const estornos=ls.filter(l=>l.tipo==="receita"&&l.cartao_id&&!ehPagCartao(l));
  return {ent,sai,gastos,estornos,E:soma(ent),S:soma(sai),G:Math.max(0,soma(gastos)-soma(estornos)),cartao:Math.max(0,soma(gastos.filter(l=>l.cartao_id))-soma(estornos))};
}

const catPorNome=n=>S.cats.find(c=>normTxt(c.nome)===normTxt(n));
function regraCat(desc){ const v=marca("cat:"+chaveGrupo(desc),"rule")||marca("cat:"+chaveDesc(desc),"rule"); return v&&S.cats.some(c=>c.id===v)?v:null; }
function sugerirCat(desc){

  for(let i=0;i<ids.length;i+=200){ const r=await sb.from("lancamentos").update({categoria_id:catId}).in("id",ids.slice(i,i+200)); if(r.error){ toast("Não salvou: "+r.error.message); return false; } }

  const por={}; S.lanc.filter(ehSemCat).forEach(l=>{ const r=regraCat(l.descricao); if(r) (por[r]=por[r]||[]).push(l.id); });

const SUB_KW=/netflix|spotify|anthropic|claude|openai|chatgpt|apple\.com|icloud|google|youtube|microsoft|xbox|playstation|nubank\+|nubank croma|nucel|plano nu|amazon prime|prime video|disney|hbo|globoplay|deezer|paramount|smart ?fit|academia|uber one|ifood clube|canva|adobe|dropbox|github|notion|\btim\b|vivo|claro/;
function assinaturas(){
  const hj=new Date(), mesAt=iso(hj).slice(0,7), lim45=iso(new Date(hj.getTime()-45*864e5));
  const base=filtro(S.lanc,"user_id").filter(l=>l.tipo==="despesa"&&l.data<=iso(hj)&&!ehInterno(l)&&!ehParcela(l)&&!ehPagCartao(l)&&!ehPagFaturaConta(l)&&!/^iof/.test(normTxt(l.descricao)));
  const g={}; base.forEach(l=>{ const k=chaveGrupo(l.descricao); (g[k]=g[k]||[]).push(l); });
  const out=[];
  Object.entries(g).forEach(([k,ls])=>{
    if(marca("sub:"+k,"ign")===true) return;
    const porMes={}; ls.forEach(l=>{ const m=l.data.slice(0,7); porMes[m]=(porMes[m]||0)+Number(l.valor); });
    const meses=Object.keys(porMes).sort(), ant=meses.filter(m=>m<mesAt), kw=SUB_KW.test(k);
    if(!(ant.length>=2 || (kw&&meses.length>=2))) return;
    const vals=ant.length?ant.map(m=>porMes[m]):meses.map(m=>porMes[m]), med=vals.reduce((a,b)=>a+b,0)/vals.length;
    const parecido=vals.every(v=>Math.abs(v-med)<=Math.max(3,med*0.25)), porMesQtd=ls.length/meses.length;
    const cobr=ls.map(l=>Number(l.valor)), medC=cobr.reduce((a,b)=>a+b,0)/cobr.length;
    const cobrParecidas=cobr.every(v=>Math.abs(v-medC)<=Math.max(3,medC*0.25));
    if(!kw && (!parecido || !cobrParecidas || porMesQtd>1.25)) return;   // assinatura = uma cobrança parecida por mês
    const ult=ls.map(l=>l.data).sort().pop(), l0=ls.find(l=>l.data===ult);
    const orig=l0.cartao_id?(S.cartoes.find(c=>c.id===l0.cartao_id)||{}).nome:(S.contas.find(c=>c.id===l0.conta_id)||{}).nome;
    out.push({k, nome:String(l0.descricao).split("|").map(t=>t.trim()).filter(Boolean).pop().replace(/\s*\(\d+\/\d+\)$/,""), mensal:med, ult, meses:meses.length, ativa:ult>=lim45, orig, cat:l0.categoria_id});
  });
  return out.sort((a,b)=>(b.ativa-a.ativa)||(b.mensal-a.mensal));
}
function secAssinaturas(){
  const l=assinaturas(), at=l.filter(x=>x.ativa), tot=at.reduce((s,x)=>s+x.mensal,0);

function dividas(){
  const cart=filtro(S.cartoes).map(c=>({nome:"Cartão "+[c.instituicao,c.nome].filter(Boolean).join(" · "),valor:Number(c.fatura_atual)||0,obs:"fatura + parcelas futuras"})).filter(x=>x.valor>0.005);

    const f=oc.faltam!=null?oc.faltam:Number(d.parcelas_restantes); return {nome:d.descricao,valor:d.saldo_devedor?Number(d.saldo_devedor):Number(d.valor)*f,obs:`${f}x de ${brl(d.valor)}`}; }).filter(Boolean);
  return [...cart,...emp];
}
function calcPatrimonio(){
  const cs=filtro(S.contas), contas=cs.filter(c=>c.tipo!=="investimento").reduce((s,c)=>s+Number(c.saldo),0), inv=cs.filter(c=>c.tipo==="investimento").reduce((s,c)=>s+Number(c.saldo),0);
  const dv=dividas(), div=dv.reduce((s,x)=>s+x.valor,0);

}
function historicoPatrimonio(atual){
  const snaps={}; (S.projs||[]).forEach(pr=>{ if(pr.user_id===S.user.id) Object.assign(snaps,(pr.dados&&pr.dados.patrimonio)||{}); }); Object.assign(snaps,S.proj.patrimonio||{});
  const ids=new Set(filtro(S.contas).filter(c=>c.tipo!=="investimento").map(c=>c.id)), hj=iso(new Date()), out=[];
  for(let i=5;i>=0;i--){ const r=mesRef(-i), mk=r.ini.slice(0,7);
    if(i===0){ out.push({mk,label:r.curto,v:atual.liq,est:false}); continue; }
    if(S.pessoa==="todos"&&snaps[mk]){ out.push({mk,label:r.curto,v:snaps[mk].liq,est:false}); continue; }
    // estimado: saldo das contas no fim do mês = saldo de hoje − o que entrou/saiu depois (investimentos e dívidas como hoje)
    const delta=S.lanc.filter(l=>ids.has(l.conta_id)&&l.data>r.fim&&l.data<=hj).reduce((s,l)=>s+(l.tipo==="receita"?1:-1)*Number(l.valor),0);

}
