function interpretar(q){
  const t=normTxt(q).replace(/[?!.,;:]/g," ").replace(/\s+/g," ").trim(), h=new Date(), y=h.getFullYear(), m=h.getMonth(), d=(yy,mm,dd)=>iso(new Date(yy,mm,dd,12));
  const tipo=/receb|entrou|entraram|ganhei|entrada|renda|salario/.test(t)?"receita":"despesa", top=/maior|maiores|\btop\b/.test(t);
  const anoM=t.match(/\b(20\d\d)\b/), ano=anoM?Number(anoM[1]):null;
  let mi=-1; MES_N.forEach((n,i)=>{ if(mi<0 && new RegExp(`\\b${n.slice(0,3)}(${n.slice(3)})?\\b`).test(t)) mi=i; });
  let de,ate,rot,prev=null;
  if(/\bhoje\b/.test(t)){ de=ate=iso(h); rot="hoje"; }
  else if(/\bontem\b/.test(t)){ const o=new Date(h); o.setDate(o.getDate()-1); de=ate=iso(o); rot="ontem"; }
  else if(/ultimos? (\d+) dias/.test(t)){ const n=Number(t.match(/ultimos? (\d+) dias/)[1]); const o=new Date(h); o.setDate(o.getDate()-n+1); de=iso(o); ate=iso(h); rot=`nos últimos ${n} dias`; }
  else if(/semana/.test(t)){ const o=new Date(h); o.setDate(o.getDate()-6); de=iso(o); ate=iso(h); rot="nos últimos 7 dias"; }
  else if(/mes passado|mes anterior/.test(t)){ de=d(y,m-1,1); ate=d(y,m,0); rot=`em ${MESES_L[(m+11)%12]}`; prev=[d(y,m-2,1),d(y,m-1,0)]; }
  else if(mi>=0){ const yy=ano||(mi>m?y-1:y); de=d(yy,mi,1); ate=d(yy,mi+1,0); if(ate>iso(h)) ate=iso(h); rot=`em ${MESES_L[mi]}${yy!==y?"/"+yy:""}`; prev=[d(yy,mi-1,1),d(yy,mi,0)]; }
  else if(/ano passado/.test(t)){ de=d(y-1,0,1); ate=d(y-1,11,31); rot=`em ${y-1}`; }
  else if(/\bano\b/.test(t)||ano){ const yy=ano||y; de=d(yy,0,1); ate=yy===y?iso(h):d(yy,11,31); rot=`em ${yy}`; }
  else { de=d(y,m,1); ate=iso(h); rot="este mês"; prev=[d(y,m-1,1),d(y,m-1,Math.min(h.getDate(),new Date(y,m,0).getDate()))]; }
  let cat=S.cats.find(c=>t.includes(normTxt(c.nome)));
  if(!cat) for(const [n,re] of Object.entries(SINON)) if(re.test(t)){ cat=catPorNome(n); if(cat) break; }
  const pessoa=S.membros.find(mb=>{ const pn=normTxt((mb.nome||"").split(" ")[0]); return pn.length>1&&new RegExp(`\\b${pn}\\b`).test(t); });
  const grp=S.grupos.find(g=>t.includes(normTxt(g.nome)));
  const soCartao=/cartao|credito/.test(t), soPix=/\bpix\b/.test(t);
  const inst=S.inst.find(i=>{ const n=normTxt(i.nome).split(" ")[0]; return n.length>1&&new RegExp(`\\b${n}\\b`).test(t); });
  // termo livre: palavras que sobraram (ex.: "atacadao", "havan", "uber")
  const conhecidas=new Set([...MES_N,...MES_N.map(n=>n.slice(0,3)),...(cat?normTxt(cat.nome).split(" "):[]),...(pessoa?normTxt(pessoa.nome).split(" "):[]),...(grp?normTxt(grp.nome).split(" "):[]),...(inst?normTxt(inst.nome).split(" "):[])]);
  let termo=t.split(" ").filter(w=>w.length>2&&!STOP.has(w)&&!conhecidas.has(w)&&!/^\d+$/.test(w)&&!Object.values(SINON).some(re=>re.test(w))).join(" ");
  if(cat&&termo&&!termo.includes(" ")&&SINON[cat.nome]&&SINON[cat.nome].test(termo)) termo="";
  return {t,tipo,top,de,ate,rot,prev,cat,pessoa,grp,soCartao,soPix,inst,termo};
}
async function responder(q){
  const p=interpretar(q);
  const filtrar=async(de,ate)=>{ let ls=await lancPeriodo(de,ate);
    if(p.pessoa) ls=ls.filter(l=>l.user_id===p.pessoa.user_id); else if(p.grp) ls=ls.filter(l=>l.grupo_id===p.grp.id); else ls=filtro(ls,"user_id");
    const a=analisarPeriodo(ls); let r=p.tipo==="receita"?a.ent:a.gastos;
    if(p.cat) r=r.filter(l=>l.categoria_id===p.cat.id);
    if(p.soCartao) r=r.filter(l=>l.cartao_id); if(p.soPix) r=r.filter(l=>!l.cartao_id&&/pix/.test(normTxt(l.descricao)));
    if(p.inst) r=r.filter(l=>{ const o=l.cartao_id?S.cartoes.find(c=>c.id===l.cartao_id):S.contas.find(c=>c.id===l.conta_id); return o&&o.instituicao_id===p.inst.id; });
    if(p.termo){ const ws=p.termo.split(" "); r=r.filter(l=>{ const d=normTxt(l.descricao); return ws.every(w=>d.includes(w)); }); }
    return r; };
  const r=await filtrar(p.de,p.ate), tot=r.reduce((s,l)=>s+Number(l.valor),0);
  let comp=""; if(p.prev){ const r2=await filtrar(p.prev[0],p.prev[1]), t2=r2.reduce((s,l)=>s+Number(l.valor),0);
    if(t2>0){ const pc=Math.round((tot-t2)/t2*100); comp=` ${pc===0?"Igual ao":pc>0?`${pc}% a mais que o`:`${-pc}% a menos que o`} período anterior (${brl(t2)}).`; } }
  const oque=[p.cat?`com ${p.cat.nome}`:"", p.termo?`em "${p.termo}"`:"", p.soCartao?"no cartão":"", p.soPix?"no Pix":"", p.inst?`no ${p.inst.nome}`:"", p.grp&&!p.pessoa?`no perfil ${p.grp.nome}`:""].filter(Boolean).join(" ");
  const quem=p.pessoa?esc(p.pessoa.nome.split(" ")[0]):"Vocês", verbo=p.tipo==="receita"?(p.pessoa?"recebeu":"receberam"):(p.pessoa?"gastou":"gastaram");
  const frase = [quem, verbo, `<b>${brl(tot)}</b>`, esc(oque), p.rot].filter(Boolean).join(" ")+".";
  const lista=[...r].sort((a,b)=>p.top?b.valor-a.valor:b.data.localeCompare(a.data)).slice(0,20);
  let porCat=""; if(!p.cat&&p.tipo==="despesa"&&r.length){ const o={}; r.forEach(l=>{ const n=(S.cats.find(c=>c.id===l.categoria_id)||{}).nome||"Sem categoria"; o[n]=(o[n]||0)+Number(l.valor); });
    porCat=`<div class="as-cats">${Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n,v])=>`<span class="pill">${esc(n)} ${brl(v)}</span>`).join("")}</div>`; }
  return `<div class="as-resp"><p class="as-frase">${frase}${comp?`<span class="muted">${comp}</span>`:""} <span class="muted">${r.length} ${r.length===1?"lançamento":"lançamentos"}.</span></p>${porCat}
    ${lista.length?`<div class="list">${lista.map(l=>`<div class="item"><div class="dot">${ic(l.cartao_id?"credit-card":p.tipo==="receita"?"arrow-down-left":"arrow-up-right")}</div>
      <div><div class="t">${esc(String(l.descricao).split("|").pop().trim())}</div><div class="m">${dt(l.data)} · ${esc(nomeMembro(l.user_id))}${(S.cats.find(c=>c.id===l.categoria_id)||{}).nome?` · ${esc(S.cats.find(c=>c.id===l.categoria_id).nome)}`:""}</div></div>
      <div class="r"><b class="amt ${p.tipo==="receita"?"pos":"neg"}">${p.tipo==="receita"?"+":"−"} ${brl(l.valor)}</b></div></div>`).join("")}</div>${r.length>20?`<p class="muted" style="font-size:.8rem;margin:6px 0 0">Mostrando ${p.top?"os 20 maiores":"os 20 mais recentes"}. Veja tudo no Relatório.</p>`:""}`
      :`<div class="empty">${ic("search")} Não achei lançamentos com esse filtro. Tente outro mês ou outra palavra.</div>`}</div>`;
}

/* efeito 3D nos cartões */
function ligarTilt(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".ccard:not(.add)").forEach(el=>{
    el.onpointermove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      el.style.transform=`rotateY(${(x-.5)*14}deg) rotateX(${(.5-y)*12}deg) translateZ(6px)`;
      el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%");};
    el.onpointerleave=()=>{el.style.transform="";};
    el.onkeydown=e=>{if(e.key==="Enter")el.click();};
  });
}

  $("#modal-root").innerHTML=`<div class="modal" id="mdl"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mdl-t">${html}</div></div>`;
  $("#mdl").onclick=e=>{if(e.target.id==="mdl")fechar();};
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=fechar);
  onMount&&onMount(); const f=$("#mdl form input:not([type=file]),#mdl form select"); f&&f.focus();
}

      if(ed) $("#c-arq").onclick=async()=>{await sb.from("contas").update({ativo:false}).eq("id",c.id); fechar(); await carregar(); render(); toast("Conta arquivada");};
      $("#fc").onsubmit=async e=>{e.preventDefault();
        const row={familia_id:S.fam.id,nome:$("#c-nome").value.trim(),tipo:$("#c-tipo").value,titular_id:$("#c-tit").value,
          instituicao_id:$("#c-inst").value||null,saldo_inicial:Number($("#c-saldo").value||0)};
        if(S.grupoOK) row.grupo_id=$("#c-grp").value||null;
        // mudou o perfil da conta: os lançamentos dela vão junto (antes, para continuarem visíveis a quem pode ver)
        if(ed && S.grupoOK && row.grupo_id!==c.grupo_id){ const rl=await sb.from("lancamentos").update({grupo_id:row.grupo_id}).eq("conta_id",c.id); if(rl.error) return $("#c-err").textContent=rl.error.message;
          // opcional: leva junto tudo do mesmo banco (investimentos, outras contas e cartões) e seus lançamentos
          if($("#c-tudo") && $("#c-tudo").checked && c.instituicao_id){
            const outras=S.contas.filter(x=>x.instituicao_id===c.instituicao_id && x.id!==c.id).map(x=>x.id);
            const cards=S.cartoes.filter(x=>x.instituicao_id===c.instituicao_id).map(x=>x.id);
            const passos=[];
            if(outras.length){ passos.push(sb.from("lancamentos").update({grupo_id:row.grupo_id}).in("conta_id",outras)); }
            if(cards.length){ passos.push(sb.from("lancamentos").update({grupo_id:row.grupo_id}).in("cartao_id",cards)); }
            for(const p of passos){ const x=await p; if(x.error) return $("#c-err").textContent=x.error.message; }
            if(outras.length){ const x=await sb.from("contas").update({grupo_id:row.grupo_id}).in("id",outras); if(x.error) return $("#c-err").textContent=x.error.message; }
            if(cards.length){ const x=await sb.from("cartoes").update({grupo_id:row.grupo_id}).in("id",cards); if(x.error) return $("#c-err").textContent=x.error.message; }
          } }
        const r= ed? await sb.from("contas").update(row).eq("id",c.id) : await sb.from("contas").insert(row);
        if(r.error) return $("#c-err").textContent=r.error.message;
        fechar(); await carregar(); render(); toast(ed?"Conta atualizada":"Conta criada");};
    });
}

  const ed=!!c; c=c||{titular_id:S.user.id,bandeira:"mastercard",limite_total:0,fatura_atual:0};
  abrir(`<h2>${ed?"Editar cartão":"Novo cartão"}</h2>
    <div class="ccard" id="prev" style="--a:#334155;--b:#0f172a;max-width:320px;align-self:center;width:100%">
      <div class="r1"><span class="bank" id="p-bank">Banco</span></div><div class="chipm"></div>
      <div class="pan num" id="p-pan">•••• •••• •••• 0000</div>
      <div class="r3"><div><div class="nick" id="p-nick"></div><div class="holder" id="p-hold"></div></div><span class="brand" id="p-brand"></span></div>
    </div>
    <form id="fk" style="display:flex;flex-direction:column;gap:12px">
      <div class="grid2">
        <label class="field"><span>Banco</span><select id="k-inst" required>${optsInst(c.instituicao_id)}</select></label>
        <label class="field"><span>Apelido</span><input id="k-nome" required value="${esc(c.nome||"")}" placeholder="Roxinho"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Bandeira</span><select id="k-band">${BANDEIRAS.map(b=>`<option ${b===c.bandeira?"selected":""}>${b}</option>`).join("")}</select></label>
        <label class="field"><span>Últimos 4 dígitos</span><input id="k-f4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="${esc(c.final4||"")}"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Titular</span><select id="k-tit">${optsMembros(c.titular_id)}</select></label>
        <label class="field"><span>Limite total (R$)</span><input id="k-lim" type="number" step="0.01" value="${c.limite_total}"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Fatura atual (R$)</span><input id="k-fat" type="number" step="0.01" value="${c.fatura_atual}"></label>
        <div class="grid2" style="grid-template-columns:1fr 1fr">
          <label class="field"><span>Fecha dia</span><input id="k-fec" type="number" min="1" max="31" value="${c.dia_fechamento||""}"></label>
          <label class="field"><span>Vence dia</span><input id="k-ven" type="number" min="1" max="31" value="${c.dia_vencimento||""}"></label>
        </div>
      </div>
      ${S.grupoOK?`<label class="field"><span>Perfil</span><select id="k-grp">${optsGrupos(ed?c.grupo_id:grupoPadrao())}</select></label>`:""}
      <div class="err" id="k-err"></div>
      <div class="row-end">${ed?`<button type="button" class="btn ghost" id="k-arq">Arquivar</button>`:""}<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div>
    </form>`, ()=>{
      const upd=()=>{const i=S.inst.find(x=>x.id===$("#k-inst").value); const p=$("#prev");
        p.style.setProperty("--a",i?.cor1||"#334155"); p.style.setProperty("--b",i?.cor2||"#0f172a");
        $("#p-bank").textContent=i?.nome||"Banco"; $("#p-pan").textContent="•••• •••• •••• "+($("#k-f4").value||"0000");
        $("#p-nick").textContent=$("#k-nome").value; $("#p-hold").textContent=nomeMembro($("#k-tit").value);
        const b=$("#k-band").value; $("#p-brand").textContent=b==="outra"?"":b;};
      ["k-inst","k-f4","k-nome","k-tit","k-band"].forEach(id=>$("#"+id).addEventListener("input",upd)); upd();
      if(ed) $("#k-arq").onclick=async()=>{await sb.from("cartoes").update({ativo:false}).eq("id",c.id); fechar(); await carregar(); render(); toast("Cartão arquivado");};
      $("#fk").onsubmit=async e=>{e.preventDefault();
        const n=v=>v===""?null:Number(v);
        const row={familia_id:S.fam.id,instituicao_id:$("#k-inst").value||null,nome:$("#k-nome").value.trim(),bandeira:$("#k-band").value,
          final4:$("#k-f4").value||null,titular_id:$("#k-tit").value,limite_total:Number($("#k-lim").value||0),
          fatura_atual:Number($("#k-fat").value||0),dia_fechamento:n($("#k-fec").value),dia_vencimento:n($("#k-ven").value)};
        if(S.grupoOK) row.grupo_id=$("#k-grp").value||null;
        if(ed && S.grupoOK && row.grupo_id!==c.grupo_id){ const rl=await sb.from("lancamentos").update({grupo_id:row.grupo_id}).eq("cartao_id",c.id); if(rl.error) return $("#k-err").textContent=rl.error.message; }
        const r= ed? await sb.from("cartoes").update(row).eq("id",c.id) : await sb.from("cartoes").insert(row);
        if(r.error) return $("#k-err").textContent=r.error.message;
        fechar(); await carregar(); render(); toast(ed?"Cartão atualizado":"Cartão adicionado");};
    });
}

function modalLanc(pre={}){
  if(!S.contas.length && !S.cartoes.length){ toast("Cadastre uma conta ou cartão primeiro"); return modalConta(); }
  let tipo="despesa";
  const origens=[...S.contas.map(c=>({v:"conta:"+c.id,t:`${c.nome} (${nomeMembro(c.titular_id)})`,din:c.tipo==="dinheiro"})),
                 ...S.cartoes.map(c=>({v:"cartao:"+c.id,t:`Cartão · ${c.nome} (${nomeMembro(c.titular_id)})`}))]
    .sort((a,b)=>(b.din?1:0)-(a.din?1:0));
  const hoje=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  abrir(`<h2>Novo lançamento</h2>
    <div class="seg" role="group"><button type="button" id="t-d" aria-pressed="true">Saída</button><button type="button" id="t-r" aria-pressed="false">Entrada</button></div>
    <form id="fl" style="display:flex;flex-direction:column;gap:12px">
      <label class="field"><span>Valor (R$)</span><input id="l-val" type="number" step="0.01" min="0.01" inputmode="decimal" required style="font-size:1.4rem;font-family:var(--f-display)"></label>
      <label class="field"><span>Descrição</span><input id="l-desc" required placeholder="Lanche"></label>
      <label class="field"><span>De onde saiu / entrou</span><select id="l-orig">${origens.map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join("")}</select></label>
      ${S.contas.some(c=>c.tipo==="dinheiro")?"":`<button type="button" class="link" style="align-self:flex-start;margin-top:-6px" data-close data-dinheiro>${ic("banknote","ico",13)} Criar carteira de dinheiro em espécie</button>`}
      <div class="grid2">
        <label class="field"><span>Categoria</span><select id="l-cat">${S.cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></label>
        <label class="field"><span>Perfil</span><select id="l-grp">${optsGrupos(grupoPadrao())}</select></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Data (1ª parcela)</span><input id="l-data" type="date" value="${hoje}" required></label>
        <label class="field"><span>Parcelas</span><select id="l-np">${Array.from({length:48},(_,i)=>`<option value="${i+1}">${i===0?"À vista":(i+1)+"x"}</option>`).join("")}</select></label>
      </div>
      <div id="l-pbox" hidden style="display:flex;flex-direction:column;gap:8px">
        <div class="seg" role="group" aria-label="O valor digitado é"><button type="button" id="l-vt" aria-pressed="true">Valor total</button><button type="button" id="l-vp" aria-pressed="false">Valor da parcela</button></div>
        <div class="muted" id="l-presumo" style="font-size:.85rem"></div>
      </div>
      <div class="err" id="l-err"></div>
      <div class="row-end"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div>
    </form>`, ()=>{
      const set=t=>{tipo=t;$("#t-d").setAttribute("aria-pressed",t==="despesa");$("#t-r").setAttribute("aria-pressed",t==="receita");};
      $("#t-d").onclick=()=>set("despesa"); $("#t-r").onclick=()=>set("receita"); $("#l-val").focus();
      if(pre.orig) $("#l-orig").value=pre.orig; if(pre.tipo) set(pre.tipo);
      if(pre.grp && $("#l-grp")) $("#l-grp").value=pre.grp;
      let ehTotal=true;
      const parcelas=()=>{ const n=Number($("#l-np").value), v=Number($("#l-val").value)||0, tot=ehTotal?v:v*n;
        const base=Math.floor(tot/n*100)/100, ult=Math.round((tot-base*(n-1))*100)/100;
        const d0=new Date($("#l-data").value+"T12:00:00");
        return Array.from({length:n},(_,i)=>{ const d=new Date(d0.getFullYear(),d0.getMonth()+i,1,12);
          d.setDate(Math.min(d0.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return {i:i+1,n,valor:i===n-1?ult:base,data:iso(d)}; }); };
      const resumo=()=>{ const n=Number($("#l-np").value); $("#l-pbox").hidden=n===1; if(n===1) return;
        const ps=parcelas(); $("#l-presumo").textContent=`${n}x de ${brl(ps[0].valor)} = ${brl(ps.reduce((s,p)=>s+p.valor,0))} · última em ${dt(ps[n-1].data)}`; };
      $("#l-vt").onclick=()=>{ehTotal=true;$("#l-vt").setAttribute("aria-pressed",true);$("#l-vp").setAttribute("aria-pressed",false);resumo();};
      $("#l-vp").onclick=()=>{ehTotal=false;$("#l-vp").setAttribute("aria-pressed",true);$("#l-vt").setAttribute("aria-pressed",false);resumo();};
      ["l-np","l-val","l-data"].forEach(i=>$("#"+i).addEventListener("input",resumo));
      $("#fl").onsubmit=async e=>{e.preventDefault();
        const [k,id]=$("#l-orig").value.split(":"), ps=parcelas(), n=ps.length, desc=$("#l-desc").value.trim();
        const compra = n>1 ? (crypto.randomUUID?crypto.randomUUID():String(Date.now())) : null;
        const rows=ps.map(p=>{ const r={familia_id:S.fam.id,user_id:S.user.id,tipo,valor:p.valor,descricao:n>1?`${desc} (${p.i}/${n})`:desc,data:p.data,
          categoria_id:$("#l-cat").value||null,grupo_id:$("#l-grp").value||null,conta_id:k==="conta"?id:null,cartao_id:k==="cartao"?id:null};
          if(n>1&&S.parcOK){ r.compra_id=compra; r.parcela_num=p.i; r.parcela_total=n; } return r; });
        const r=await sb.from("lancamentos").insert(rows); if(r.error) return $("#l-err").textContent=r.error.message;
        if(k==="cartao"){ const c=S.cartoes.find(x=>x.id===id); const hojeIso=iso(new Date());
          const agora=ps.filter(p=>p.data<=hojeIso).reduce((s,p)=>s+p.valor,0);
          if(c&&c.origem==="manual"&&agora>0){ const nf=Math.max(0,Number(c.fatura_atual)+(tipo==="despesa"?agora:-agora));
            await sb.from("cartoes").update({fatura_atual:nf}).eq("id",id);} }
        fechar(); await carregar(); render(); toast(n>1?`${n} parcelas lançadas`:"Lançamento salvo");};
    });
}

async function excluir(tipo,id,btn){
  if(btn.dataset.confirm!=="1"){ const h0=btn.innerHTML; btn.dataset.confirm="1"; btn.classList.add("confirm"); btn.textContent=tipo==="compra"?"Apagar todas as parcelas?":"Confirmar"; setTimeout(()=>{if(btn.isConnected){btn.dataset.confirm="";btn.classList.remove("confirm");btn.innerHTML=h0;}},3500); return; }
  const x=S.lanc.find(l=>l.id===id), hojeIso=iso(new Date());
  const alvo = tipo==="compra" && x?.compra_id ? S.lanc.filter(l=>l.compra_id===x.compra_id) : [x];
  const r = tipo==="compra" && x?.compra_id ? await sb.from("lancamentos").delete().eq("compra_id",x.compra_id) : await sb.from("lancamentos").delete().eq("id",id);
  if(r.error) return toast(r.error.message);
  const vAgora = alvo.filter(l=>l&&l.data<=hojeIso).reduce((s,l)=>s+(l.tipo==="despesa"?1:-1)*Number(l.valor),0);
  if(x?.cartao_id && vAgora!==0){ const c=S.cartoes.find(k=>k.id===x.cartao_id); if(c&&c.origem==="manual"){
    const nf=Math.max(0,Number(c.fatura_atual)-vAgora);
    await sb.from("cartoes").update({fatura_atual:nf}).eq("id",c.id);} }
  await carregar(); render(); toast(alvo.length>1?`${alvo.length} parcelas excluídas`:"Lançamento excluído");
}

if(real) real.auth.onAuthStateChange((ev)=>{ if(!DEMO&&(ev==="SIGNED_IN"||ev==="SIGNED_OUT")) boot(); });
boot();
</script>
